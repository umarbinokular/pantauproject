const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im51emhtaWdreGF4ZW91amVpa21vIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI0NjgxMjgsImV4cCI6MjEwODA0NDEyOH0.u8UORj_z6kGJCTnPX92AVSWk8lhl1CPT89g9-5e_h5g';

/* ═══════════════════════════════════════════════════
   SUPABASE DATA LAYER
   ═══════════════════════════════════════════════════ */
const DB = {
  // ─── Users ───
  async getUsers() {
    const { data } = await sb.from('users').select('*').order('name');
    return (data || []).map(u => ({
      id: 'u' + u.id, _dbId: u.id,
      username: u.username, password: u.password,
      name: u.name, role: u.role, active: u.active,
    }));
  },
  async saveUsers(users) {
    for (const u of users) {
      if (u._dbId) {
        await sb.from('users').update({
          username: u.username, password: u.password,
          name: u.name, role: u.role, active: u.active,
        }).eq('id', u._dbId);
      } else {
        const { data } = await sb.from('users').insert({
          username: u.username, password: u.password,
          name: u.name, role: u.role, active: u.active !== false,
        }).select().single();
        if (data) u._dbId = data.id;
      }
    }
  },
  async resetAdmin() {
    await sb.from('users').update({ username:'admin', password:'admin123', name:'Administrator', role:'admin', active:true }).eq('id', 1);
  },

  // ─── Divisions ───
  async getDivisions() {
    const { data } = await sb.from('divisions').select('*').eq('active', true).order('name');
    return (data || []).map(d => ({ id: d.id, name: d.name }));
  },
  async saveDivisions(divNames) {
    const { data: current } = await sb.from('divisions').select('*');
    const existing = current || [];
    const existingNames = existing.map(d => d.name.toLowerCase());
    for (const name of divNames) {
      if (!existingNames.includes(name.toLowerCase())) {
        await sb.from('divisions').insert({ name, active: true });
      }
    }
    for (const d of existing) {
      if (!divNames.some(n => n.toLowerCase() === d.name.toLowerCase())) {
        await sb.from('divisions').update({ active: false }).eq('id', d.id);
      } else if (!d.active) {
        await sb.from('divisions').update({ active: true }).eq('id', d.id);
      }
    }
  },

  // ─── Projects + Milestones ───
  async getProjects(divMap) {
    const { data: projects } = await sb.from('projects').select('*').order('sort_order');
    const { data: milestones } = await sb.from('milestones').select('*').order('sort_order');
    if (!projects) return [];
    const msMap = {};
    (milestones || []).forEach(m => {
      if (!msMap[m.project_id]) msMap[m.project_id] = [];
      msMap[m.project_id].push({ l: m.label, d: m.is_done, s: m.start_date || '', e: m.end_date || '', _dbId: m.id });
    });
    return projects.map(p => ({
      id: 'p' + p.id, _dbId: p.id,
      name: p.name,
      div: divMap[p.division_id] || '',
      _divId: p.division_id,
      phase: p.manual_phase || calcPhaseFromProgress(p.progress),
      health: p.health || 'on_track',
      progress: p.progress || 0,
      start: p.start_date || '',
      deadline: p.deadline || '',
      summary: p.summary || '',
      priority: p.priority || 'normal',
      requirements: p.requirements || '',
      comments: p.comments || [],
      milestones: msMap[p.id] || [],
      updated: p.updated_at ? new Date(p.updated_at).toLocaleDateString('id-ID', { day:'numeric', month:'short' }) : '',
      _manualPhase: p.manual_phase || null,
      _archived: p.archived || false,
      _prevPhase: p.prev_phase || null,
    }));
  },
  async saveProject(p, divNameToId) {
    const divId = divNameToId[p.div];
    if (!divId) return p;
    if (p._dbId) {
      await sb.from('projects').update({
        name: p.name, division_id: divId,
        phase: p.phase, health: p.health, progress: p.progress,
        start_date: p.start || null, deadline: p.deadline || null,
        summary: p.summary, manual_phase: p._manualPhase || null,
        priority: p.priority || 'normal',
        requirements: p.requirements || '',
        comments: p.comments || [],
      }).eq('id', p._dbId);
      await sb.from('milestones').delete().eq('project_id', p._dbId);
      if (p.milestones.length > 0) {
        await sb.from('milestones').insert(p.milestones.map((m, i) => ({
          project_id: p._dbId, label: m.l, is_done: m.d,
          start_date: m.s || null, end_date: m.e || null, sort_order: i,
        })));
      }
    } else {
      const { data } = await sb.from('projects').insert({
        name: p.name, division_id: divId,
        phase: p.phase, health: p.health, progress: p.progress,
        start_date: p.start || null, deadline: p.deadline || null,
        summary: p.summary, manual_phase: p._manualPhase || null,
        priority: p.priority || 'normal',
        requirements: p.requirements || '',
        comments: p.comments || [],
        sort_order: 0,
      }).select().single();
      if (data) {
        p._dbId = data.id;
        p.id = 'p' + data.id;
        if (p.milestones.length > 0) {
          await sb.from('milestones').insert(p.milestones.map((m, i) => ({
            project_id: data.id, label: m.l, is_done: m.d,
            start_date: m.s || null, end_date: m.e || null, sort_order: i,
          })));
        }
      }
    }
    return p;
  },
  async deleteProject(dbId) {
    await sb.from('projects').delete().eq('id', dbId);
  },

  // ─── Notifications ───
  async getNotifications(userName) {
    const { data } = await sb.from('notifications').select('*').order('created_at', { ascending: false }).limit(200);
    return (data || []).map(n => ({
      id: n.id, _dbId: n.id,
      user: n.sender, text: n.text, type: n.type || 'comment',
      time: new Date(n.created_at).toLocaleString('id-ID', { day:'numeric', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' }),
      taskName: n.task_name, taskId: n.task_id,
      read: n.read,
      _forUser: n.user_name,
    }));
  },
  async addNotification(notif, forUsers) {
    const rows = forUsers.map(u => ({
      user_name: u, sender: notif.user, text: notif.text,
      type: notif.type || 'comment', task_name: notif.taskName,
      task_id: notif.taskId, read: false,
    }));
    const { data } = await sb.from('notifications').insert(rows).select();
    return data || [];
  },
  async markNotifRead(notifId) {
    await sb.from('notifications').update({ read: true }).eq('id', notifId);
  },
  async markAllNotifsRead(userName) {
    await sb.from('notifications').update({ read: true }).eq('user_name', userName).eq('read', false);
  },
  async clearNotifications(userName) {
    await sb.from('notifications').delete().eq('user_name', userName);
  },

  // ─── Activity Log ───
  async getActivityLog() {
    const { data } = await sb.from('activity_log').select('*').order('created_at', { ascending: false }).limit(200);
    return (data || []).map(l => ({
      id: l.id, _dbId: l.id,
      action: l.action, taskName: l.task_name,
      detail: l.detail, user: l.user_name,
      time: new Date(l.created_at).toLocaleString('id-ID', { day:'numeric', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' }),
    }));
  },
  async addActivityLog(entry) {
    const { data } = await sb.from('activity_log').insert({
      action: entry.action, task_name: entry.taskName,
      detail: entry.detail, user_name: entry.user,
    }).select().single();
    return data;
  },
  async clearActivityLog() {
    await sb.from('activity_log').delete().neq('id', 0);
  },

  // ─── Archive ───
  async archiveProject(dbId, prevPhase) {
    await sb.from('projects').update({ archived: true, prev_phase: prevPhase }).eq('id', dbId);
  },
  async restoreProject(dbId, targetPhase) {
    await sb.from('projects').update({ archived: false, prev_phase: null, manual_phase: targetPhase }).eq('id', dbId);
  },
};

function calcPhaseFromProgress(progress) {
  if (progress >= 100) return 'completed';
  if (progress >= 75) return 'review';
  if (progress > 0) return 'in_progress';
  return 'initiation';
}

/* ─── Auto-calculation ─── */
function calcProgress(milestones) {
  if (!milestones || milestones.length === 0) return 0;
  return Math.round((milestones.filter(m => m.d).length / milestones.length) * 100);
}

function calcMilestoneHealth(m) {
  if (m.d) return "done";
  const now = new Date();
  const end = new Date(m.e);
  const start = new Date(m.s);
  if (isNaN(end.getTime())) return "on_track";
  if (now > end) return "delayed";
  const totalDays = Math.max((end - start) / (1000*60*60*24), 1);
  const remaining = (end - now) / (1000*60*60*24);
  if (remaining / totalDays <= 0.25) return "at_risk";
  return "on_track";
}

function milestoneRemaining(m) {
  if (m.d) return "Selesai";
  const now = new Date();
  const end = new Date(m.e);
  if (isNaN(end.getTime())) return "";
  const days = Math.ceil((end - now) / (1000*60*60*24));
  if (days < 0) return `Terlambat ${Math.abs(days)} hari`;
  if (days === 0) return "Hari ini!";
  return `Sisa ${days} hari`;
}

const MS_COLORS = {
  done: "#48BB78",
  on_track: "#6C7AE0",
  at_risk: "#ECC94B",
  delayed: "#E53E3E",
};

function calcHealth(progress, start, deadline) {
  if (progress >= 100) return "completed";
  const now = new Date();
  const dl = new Date(deadline);
  const st = new Date(start);
  if (isNaN(dl.getTime()) || isNaN(st.getTime())) return "on_track";
  const totalDays = (dl - st) / (1000*60*60*24);
  const elapsedDays = (now - st) / (1000*60*60*24);
  const timeUsedPct = totalDays > 0 ? (elapsedDays / totalDays) * 100 : 0;
  if (now > dl && progress < 100) return "delayed";
  if (timeUsedPct > progress + 30) return "at_risk";
  return "on_track";
}


function calcPhase(progress) {
  if (progress >= 100) return "completed";
  if (progress >= 75) return "review";
  if (progress > 0) return "in_progress";
  return "initiation";
}

function autoCalc(p, manualPhase) {
  const progress = calcProgress(p.milestones);
  const health = p.health === "blocked" ? "blocked" : calcHealth(progress, p.start, p.deadline);
  const phase = manualPhase || p._manualPhase || calcPhase(progress);
  return { ...p, progress, health, phase, _manualPhase: manualPhase || p._manualPhase || null };
}

                    background: p.progress>=80?"#48BB78":p.progress>=50?"#6C7AE0":p.progress>=25?"#ECC94B":"#E53E3E" }} />
                </div>
                <span style={{ fontSize:14, fontWeight:800, color:"var(--text-primary)" }}>{p.progress}%</span>
              </div>
            </div>
          </div>

          <div style={{ background:"var(--bg-secondary)", borderRadius:10, padding:12, marginBottom:14, borderLeft:`3px solid ${h.border}` }}>
            <div style={{ fontSize:9, color:"var(--text-muted)", fontWeight:600, marginBottom:3 }}>SITUASI TERKINI</div>
            <p style={{ fontSize:13, color:"var(--text-primary)", lineHeight:1.55, margin:0 }}>{p.summary}</p>
          </div>

          <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:6, marginBottom:14 }}>
            {[
              {i:"📅",l:"Mulai",v:p.start},
              {i:"🏁",l:"Target Selesai",v:p.deadline},
            ].map(x=>(
              <div key={x.l} style={{ background:"var(--bg-secondary)", borderRadius:8, padding:"7px 10px" }}>
                <div style={{ fontSize:9, color:"var(--text-muted)" }}>{x.i} {x.l}</div>
                <div style={{ fontSize:13, fontWeight:700, color:"var(--text-primary)" }}>{x.v}</div>
              </div>
            ))}
          </div>

          <div style={{ marginBottom:16 }}>
            <div style={{ fontSize:10, fontWeight:600, color:"var(--text-primary)", marginBottom:6 }}>Tahapan ({doneMil}/{p.milestones.length} selesai)</div>
            <div style={{ display:"flex", gap:3, marginBottom:10 }}>
              {p.milestones.map((m,i)=>{ const mh=calcMilestoneHealth(m); return <div key={i} style={{ flex:1, height:5, borderRadius:3, background:MS_COLORS[mh] }} />; })}
            </div>
            {p.milestones.map((m,i)=>{
              const mh = calcMilestoneHealth(m);
              const rem = milestoneRemaining(m);
              const remColor = mh==="done"?"#48BB78":mh==="delayed"?"#E53E3E":mh==="at_risk"?"#D69E2E":"var(--text-secondary)";
              return (
                <div key={i} style={{ padding:"8px 0", borderBottom: i<p.milestones.length-1?"1px solid var(--border-light)":"none" }}>
                  <div style={{ display:"flex", alignItems:"center", gap:8 }}>
                    <span style={{ width:20, height:20, borderRadius:"50%", background:MS_COLORS[mh], display:"flex", alignItems:"center", justifyContent:"center", fontSize:9, fontWeight:800, color:"#fff", flexShrink:0 }}>{m.d?"✓":i+1}</span>
                    <span style={{ fontSize:12, fontWeight:600, color:m.d?"#48BB78":"var(--text-primary)", flex:1 }}>{m.l}</span>
                    <span style={{ fontSize:10, fontWeight:600, color:remColor }}>{rem}</span>
                  </div>
                  {(m.s || m.e) && (
                    <div style={{ fontSize:10, color:"var(--text-muted)", marginLeft:28, marginTop:2 }}>
                      📅 {m.s || "?"} — {m.e || "?"}
                    </div>
                  )}
                </div>
              );
            })}
          </div>

          {/* Requirements */}
          {p.requirements && (
            <div style={{ background:"var(--bg-secondary)", borderRadius:10, padding:12, marginBottom:14, borderLeft:"3px solid var(--accent)" }}>
              <div style={{ fontSize:9, color:"var(--text-muted)", fontWeight:600, marginBottom:3 }}>📝 REQUIREMENT</div>
              <p style={{ fontSize:13, color:"var(--text-primary)", lineHeight:1.55, margin:0, whiteSpace:"pre-wrap" }}>{p.requirements}</p>
            </div>
          )}

          {/* Comments */}
          <div style={{ marginBottom:14 }}>
            <div style={{ fontSize:10, fontWeight:600, color:"var(--text-primary)", marginBottom:8 }}>💬 Komentar ({(p.comments || []).length})</div>
            {(p.comments || []).length === 0 && (
              <div style={{ fontSize:12, color:"var(--text-muted)", fontStyle:"italic", marginBottom:8 }}>Belum ada komentar</div>
            )}
            {(p.comments || []).map((c, i) => {
              const canEdit = isAdmin || (currentUser && c.user === currentUser.name);
              const isEditingThis = editingCommentIdx === i;
              return (
              <div key={i} style={{ background:"var(--bg-secondary)", borderRadius:10, padding:"10px 12px", marginBottom:6 }}>
                <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:4 }}>
                  <span style={{ fontSize:11, fontWeight:700, color:"var(--accent)" }}>{c.user}</span>
                  <div style={{ display:"flex", alignItems:"center", gap:6 }}>
                    <span style={{ fontSize:10, color:"var(--text-muted)" }}>{c.time}{c.edited ? " (diedit)" : ""}</span>
                    {canEdit && !isEditingThis && (
                      <button onClick={(e)=>{e.stopPropagation();setEditingCommentIdx(i);setEditCommentText(c.text);}} title="Edit komentar" style={{
                        background:"none", border:"none", cursor:"pointer", fontSize:11, color:"var(--text-muted)", padding:"0 2px", lineHeight:1,
                        opacity:0.5, transition:"opacity .15s",
                      }}
                      onMouseEnter={e=>e.currentTarget.style.opacity="1"}
                      onMouseLeave={e=>e.currentTarget.style.opacity="0.5"}
                      >✏️</button>
                    )}
                    {isAdmin && (
                      <button onClick={(e)=>{e.stopPropagation();const updated={...p,comments:(p.comments||[]).filter((_,idx)=>idx!==i)};onSave(updated);setEditingCommentIdx(-1);}} title="Hapus komentar" style={{
                        background:"none", border:"none", cursor:"pointer", fontSize:12, color:"var(--text-muted)", padding:"0 2px", lineHeight:1,
                        opacity:0.5, transition:"opacity .15s",
                      }}
                      onMouseEnter={e=>e.currentTarget.style.opacity="1"}
                      onMouseLeave={e=>e.currentTarget.style.opacity="0.5"}
                      >🗑️</button>
                    )}
                  </div>
                </div>
                {isEditingThis ? (
                  <div style={{ display:"flex", flexDirection:"column", gap:6 }}>
                    <textarea value={editCommentText} onChange={e=>setEditCommentText(e.target.value)} rows={2}
                      style={{ width:"100%", fontSize:12, padding:"6px 8px", borderRadius:6, border:"1px solid var(--border)", background:"var(--bg-primary)", color:"var(--text-primary)", resize:"vertical", fontFamily:"inherit", boxSizing:"border-box" }} />
                    <div style={{ display:"flex", gap:6, justifyContent:"flex-end" }}>
                      <button onClick={()=>{setEditingCommentIdx(-1);setEditCommentText("");}} style={{
                        padding:"4px 10px", borderRadius:6, border:"1px solid var(--border)", background:"var(--bg-primary)", color:"var(--text-secondary)", fontSize:11, cursor:"pointer",
                      }}>Batal</button>
                      <button onClick={()=>{
                        if(!editCommentText.trim()) return;
                        const updatedComments = (p.comments||[]).map((cm,idx)=> idx===i ? {...cm, text:editCommentText.trim(), edited:true} : cm);
                        onSave({...p, comments:updatedComments});
                        setEditingCommentIdx(-1); setEditCommentText("");
                      }} disabled={!editCommentText.trim()} style={{
                        padding:"4px 10px", borderRadius:6, border:"none", background: editCommentText.trim() ? "var(--accent)" : "var(--bg-column)",
                        color: editCommentText.trim() ? "#fff" : "var(--text-muted)", fontSize:11, fontWeight:700, cursor: editCommentText.trim() ? "pointer" : "default",
                      }}>Simpan</button>
                    </div>
                  </div>
                ) : (
                  <p style={{ fontSize:12, color:"var(--text-primary)", lineHeight:1.5, margin:0 }}>{c.text}</p>
                )}
              </div>
              );
            })}
            <div style={{ display:"flex", gap:6, marginTop:6 }}>
              <input value={newComment} onChange={e=>setNewComment(e.target.value)} placeholder="Tulis komentar..."
                onKeyDown={e=>e.key==="Enter"&&addComment()}
                style={{...inputStyle, flex:1, padding:"8px 10px", fontSize:12}} />
              <button onClick={addComment} disabled={!newComment.trim()} style={{
                padding:"8px 14px", borderRadius:8, border:"none", background: newComment.trim() ? "var(--accent)" : "var(--bg-column)",
                color: newComment.trim() ? "#fff" : "var(--text-muted)", fontSize:12, fontWeight:700, cursor: newComment.trim() ? "pointer" : "default",
              }}>Kirim</button>
            </div>
          </div>

          <div style={{ fontSize:10, color:"var(--text-subtle)", marginBottom:14 }}>Update: {p.updated}</div>

          {isAdmin && (
            <div style={{ marginBottom:10 }}>
              <div style={{ fontSize:10, fontWeight:600, color:"var(--text-muted)", marginBottom:6 }}>PINDAHKAN KE</div>
              <div style={{ display:"flex", gap:6, flexWrap:"wrap" }}>
                {PHASES.map(ph => {
                  const isCurrent = p.phase === ph.id;
                  return (
                    <button key={ph.id} onClick={()=>{ if(!isCurrent){ onMove(p.id, ph.id); onClose(); }}}
                      disabled={isCurrent}
                      style={{
                        flex:1, minWidth:80, padding:"8px 6px", borderRadius:8, cursor: isCurrent?"default":"pointer",
                        border: isCurrent ? "1.5px solid var(--accent)" : "1.5px solid var(--border)",
                        background: isCurrent ? "var(--accent-bg)" : "var(--bg-card)",
                        color: isCurrent ? "var(--accent)" : "var(--text-secondary)",
                        fontSize:11, fontWeight:600, opacity: isCurrent ? 1 : 0.85,
                        transition:"all .15s",
                      }}>
                      {ph.l}{isCurrent ? " ✓" : ""}
                    </button>
                  );
                })}
              </div>
            </div>
          )}

          {isAdmin && (
            <div style={{ display:"flex", gap:8 }}>
              <button onClick={()=>setEditing(true)} style={{ flex:1, padding:"10px", borderRadius:10, border:"none", background:"var(--accent)", color:"#fff", fontSize:13, fontWeight:700, cursor:"pointer" }}>✏️ Edit Project</button>
              <button onClick={()=>setConfirmArchive(true)} title="Arsipkan" style={{ padding:"10px 16px", borderRadius:10, border:"1.5px solid var(--border)", background:"var(--bg-secondary)", color:"var(--text-secondary)", fontSize:13, fontWeight:600, cursor:"pointer" }}>📦</button>
            </div>
          )}

          {confirmArchive && (
            <div style={{ position:"absolute", inset:0, background:"rgba(255,255,255,0.92)", borderRadius:18, display:"flex", alignItems:"center", justifyContent:"center", zIndex:10 }}>
              <div style={{ background:"var(--bg-card)", borderRadius:14, padding:"24px 20px", boxShadow:"0 4px 20px rgba(0,0,0,0.12)", maxWidth:300, width:"100%", textAlign:"center" }}>
                <div style={{ fontSize:28, marginBottom:8 }}>📦</div>
                <div style={{ fontSize:14, fontWeight:700, color:"var(--text-primary)", marginBottom:4 }}>Arsipkan Project</div>
                <div style={{ fontSize:12, color:"var(--text-secondary)", marginBottom:16 }}>Yakin ingin memindahkan project "{p.name}" ke arsip?</div>
                <div style={{ display:"flex", gap:8 }}>
                  <button onClick={()=>{if(onArchive)onArchive(p.id);}} style={{ flex:1, padding:"10px", borderRadius:10, border:"none", background:"#DD6B20", color:"#fff", fontSize:13, fontWeight:700, cursor:"pointer" }}>Ya, Arsipkan</button>
                  <button onClick={()=>setConfirmArchive(false)} style={{ flex:1, padding:"10px", borderRadius:10, border:"1.5px solid var(--border)", background:"var(--bg-card)", color:"var(--text-secondary)", fontSize:13, fontWeight:600, cursor:"pointer" }}>Batal</button>
                </div>
              </div>
            </div>
          )}
        </>)}

        {editing && (<>
          <h2 style={{ fontSize:17, fontWeight:800, color:"var(--text-primary)", margin:"0 0 16px" }}>✏️ Edit Project</h2>

          <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:10, marginBottom:10 }}>
            <div style={{ gridColumn:"1/-1" }}>
              <label style={labelStyle}>Nama Project</label>
              <input value={form.name} onChange={e=>set("name",e.target.value)} style={inputStyle} />
            </div>
            <div style={{ gridColumn:"1/-1" }}>
              <label style={labelStyle}>Divisi</label>
              <select value={form.div} onChange={e=>set("div",e.target.value)} style={inputStyle}>
                {divs.map(d=><option key={d} value={d}>{d}</option>)}
              </select>
            </div>
            <div>
              <label style={labelStyle}>Tanggal Mulai</label>
              <input type="date" value={form.start} onChange={e=>set("start",e.target.value)} style={inputStyle} />
            </div>
            <div>
              <label style={labelStyle}>Deadline</label>
              <input type="date" value={form.deadline} onChange={e=>set("deadline",e.target.value)} style={inputStyle} />
            </div>
            <div style={{ gridColumn:"1/-1" }}>
              <label style={labelStyle}>Prioritas</label>
              <div style={{ display:"flex", gap:8 }}>
                <button type="button" onClick={()=>set("priority","priority")} style={{
                  flex:1, padding:"8px 12px", borderRadius:8, fontSize:12, fontWeight:600, cursor:"pointer",
                  border: form.priority==="priority" ? "2px solid #E53E3E" : "1.5px solid var(--border)",
                  background: form.priority==="priority" ? "var(--priority-badge-bg)" : "var(--bg-card)",
                  color: form.priority==="priority" ? "var(--priority-badge-color)" : "var(--text-secondary)",
                }}>🔥 Prioritas</button>
                <button type="button" onClick={()=>set("priority","normal")} style={{
                  flex:1, padding:"8px 12px", borderRadius:8, fontSize:12, fontWeight:600, cursor:"pointer",
                  border: form.priority==="normal" ? "2px solid var(--accent)" : "1.5px solid var(--border)",
                  background: form.priority==="normal" ? "var(--accent-bg)" : "var(--bg-card)",
                  color: form.priority==="normal" ? "var(--accent)" : "var(--text-secondary)",
                }}>📁 Reguler</button>
              </div>
            </div>
          </div>

          {(() => {
            const preview = autoCalc(form);
            const hp = H[preview.health];
            const php = PHASES.find(x=>x.id===preview.phase);
            return (
              <div style={{ display:"flex", gap:8, marginBottom:10, flexWrap:"wrap" }}>
                <div style={{ flex:"1 1 130px", background:hp.bg, borderRadius:8, padding:"8px 12px" }}>
                  <div style={{ fontSize:9, color:hp.c, opacity:.7, fontWeight:600 }}>STATUS (otomatis)</div>
                  <div style={{ fontSize:13, fontWeight:700, color:hp.c }}>{hp.e} {hp.l}</div>
                </div>
                <div style={{ flex:"1 1 130px", background:"var(--bg-secondary)", borderRadius:8, padding:"8px 12px" }}>
                  <div style={{ fontSize:9, color:"var(--text-muted)", fontWeight:600 }}>PROGRESS (otomatis)</div>
                  <div style={{ fontSize:13, fontWeight:700, color:"var(--text-primary)" }}>{preview.progress}%</div>
                </div>
                <div style={{ flex:"1 1 130px", background:"var(--bg-secondary)", borderRadius:8, padding:"8px 12px" }}>
                  <div style={{ fontSize:9, color:"var(--text-muted)", fontWeight:600 }}>FASE (otomatis)</div>
                  <div style={{ fontSize:13, fontWeight:700, color:"var(--text-primary)" }}>{php?.l || preview.phase}</div>
                </div>
              </div>
            );
          })()}

          <div style={{ marginBottom:10 }}>
            <label style={{ display:"flex", alignItems:"center", gap:8, cursor:"pointer", fontSize:12, color:"#97266D", fontWeight:600 }}>
              <input type="checkbox" checked={form.health === "blocked"} onChange={e => set("health", e.target.checked ? "blocked" : "on_track")}
                style={{ width:16, height:16, cursor:"pointer" }} />
              🚫 Tandai sebagai Terhambat (blocked)
            </label>
          </div>

          <div style={{ marginBottom:10 }}>
            <label style={labelStyle}>Situasi Terkini</label>
            <textarea value={form.summary} onChange={e=>set("summary",e.target.value)} rows={3}
              style={{...inputStyle, resize:"vertical", fontFamily:"inherit"}} />
          </div>

          <div style={{ marginBottom:10 }}>
            <label style={labelStyle}>📝 Requirement</label>
            <textarea value={form.requirements || ""} onChange={e=>set("requirements",e.target.value)} rows={3} placeholder="Tuliskan kebutuhan / requirement project..."
              style={{...inputStyle, resize:"vertical", fontFamily:"inherit"}} />
          </div>

          <div style={{ marginBottom:16 }}>
            <label style={{...labelStyle, marginBottom:8}}>Tahapan / Milestone</label>
            {form.milestones.map((m,i)=>{
              const mh = calcMilestoneHealth(m);
              const rem = milestoneRemaining(m);
              return (
                <div key={i} style={{ marginBottom:10, padding:"10px 12px", background:"var(--bg-secondary)", borderRadius:10, borderLeft:`3px solid ${MS_COLORS[mh]}` }}>
                  <div style={{ display:"flex", alignItems:"center", gap:6, marginBottom:6 }}>
                    <button onClick={()=>toggleMilestone(i)} style={{
                      width:24, height:24, borderRadius:"50%", border:"none", cursor:"pointer", flexShrink:0,
                      background: MS_COLORS[mh], color:"#fff",
                      fontSize:11, fontWeight:800, display:"flex", alignItems:"center", justifyContent:"center",
                    }}>{m.d?"✓":i+1}</button>
                    <input value={m.l} onChange={e=>updateMilestoneField(i,"l",e.target.value)} placeholder={`Tahap ${i+1}`}
                      style={{...inputStyle, flex:1, padding:"6px 8px", fontSize:12}} />
                    <span style={{ fontSize:9, fontWeight:600, color: mh==="done"?"#48BB78":mh==="delayed"?"#E53E3E":mh==="at_risk"?"#D69E2E":"#6C7AE0", whiteSpace:"nowrap" }}>{rem}</span>
                    <button onClick={()=>removeMilestone(i)} style={{ background:"none", border:"none", cursor:"pointer", color:"var(--danger)", fontSize:14, padding:4 }}>✕</button>
                  </div>
                  <div style={{ display:"flex", gap:6, marginLeft:30 }}>
                    <input type="date" value={m.s||""} onChange={e=>updateMilestoneField(i,"s",e.target.value)}
                      style={{...inputStyle, flex:1, padding:"4px 8px", fontSize:11}} />
                    <input type="date" value={m.e||""} onChange={e=>updateMilestoneField(i,"e",e.target.value)}
                      style={{...inputStyle, flex:1, padding:"4px 8px", fontSize:11}} />
                  </div>
                </div>
              );
            })}
            {form.milestones.length < 8 && (
              <button onClick={addMilestone} style={{ fontSize:12, color:"var(--accent)", background:"none", border:"1.5px dashed var(--text-subtle)", borderRadius:8, padding:"6px 12px", cursor:"pointer", width:"100%", fontWeight:600 }}>
                + Tambah Tahapan
              </button>
            )}
          </div>

          <div style={{ display:"flex", gap:8 }}>
            <button onClick={handleSave} style={{ flex:1, padding:"10px", borderRadius:10, border:"none", background:"var(--success)", color:"#fff", fontSize:13, fontWeight:700, cursor:"pointer" }}>💾 Simpan</button>
            <button onClick={handleCancel} style={{ flex:1, padding:"10px", borderRadius:10, border:"1.5px solid var(--border)", background:"var(--bg-card)", color:"var(--text-secondary)", fontSize:13, fontWeight:600, cursor:"pointer" }}>Batal</button>
          </div>
        </>)}

        {showSaveConfirm && (
          <div style={{ position:"absolute", inset:0, background:"rgba(255,255,255,0.92)", borderRadius:18, display:"flex", alignItems:"center", justifyContent:"center", zIndex:10 }}>
            <div style={{ background:"var(--bg-card)", borderRadius:14, padding:"24px 20px", boxShadow:"0 4px 20px rgba(0,0,0,0.12)", maxWidth:320, width:"100%", textAlign:"center" }}>
              <div style={{ fontSize:28, marginBottom:8 }}>💾</div>
              <div style={{ fontSize:14, fontWeight:700, color:"var(--text-primary)", marginBottom:4 }}>Ada perubahan belum disimpan</div>
              <div style={{ fontSize:12, color:"var(--text-secondary)", marginBottom:16 }}>Simpan perubahan sebelum keluar?</div>
              <div style={{ display:"flex", gap:8 }}>
                <button onClick={()=>{onSave(form);onClose();}} style={{ flex:1, padding:"10px", borderRadius:10, border:"none", background:"var(--success)", color:"#fff", fontSize:13, fontWeight:700, cursor:"pointer" }}>Simpan</button>
                <button onClick={onClose} style={{ flex:1, padding:"10px", borderRadius:10, border:"1.5px solid var(--border)", background:"var(--bg-card)", color:"var(--text-secondary)", fontSize:13, fontWeight:600, cursor:"pointer" }}>Buang</button>
                <button onClick={()=>setShowSaveConfirm(false)} style={{ flex:1, padding:"10px", borderRadius:10, border:"1.5px solid var(--border)", background:"var(--bg-card)", color:"var(--text-secondary)", fontSize:13, fontWeight:600, cursor:"pointer" }}>Kembali</button>
              </div>
            </div>
          </div>
        )}

      </div>
    </div>
  );
}

/* ── Add Project Modal ── */

        <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:10, marginBottom:10 }}>
          <div style={{ gridColumn:"1/-1" }}>
            <label style={labelStyle}>Nama Project *</label>
            <input value={form.name} onChange={e=>set("name",e.target.value)} placeholder="Nama project..." style={inputStyle} autoFocus />
          </div>
          <div style={{ gridColumn:"1/-1" }}>
            <label style={labelStyle}>Divisi</label>

          <div>
            <label style={labelStyle}>Tanggal Mulai</label>
            <input type="date" value={form.start} onChange={e=>set("start",e.target.value)} style={inputStyle} />
          </div>
          <div>
            <label style={labelStyle}>Deadline</label>
            <input type="date" value={form.deadline} onChange={e=>set("deadline",e.target.value)} style={inputStyle} />

          <div style={{ gridColumn:"1/-1" }}>
            <label style={labelStyle}>Prioritas</label>

                flex:1, padding:"8px 12px", borderRadius:8, fontSize:12, fontWeight:600, cursor:"pointer",
                border: form.priority==="priority" ? "2px solid #E53E3E" : "1.5px solid var(--border)",
                background: form.priority==="priority" ? "var(--priority-badge-bg)" : "var(--bg-card)",
                color: form.priority==="priority" ? "var(--priority-badge-color)" : "var(--text-secondary)",
              }}>🔥 Prioritas</button>
              <button type="button" onClick={()=>set("priority","normal")} style={{

/* ── Division Management Modal ── */
function DivModal({ divs, onClose, onSave, projects }) {
  const [list, setList] = useState([...divs]);
  const [newName, setNewName] = useState("");

  const usedDivs = new Set(projects.map(p=>p.div));

  const handleAdd = () => {
    if(!newName.trim() || list.some(d=>d.toLowerCase()===newName.trim().toLowerCase())) return;
    setList(prev=>[...prev, newName.trim()]);
    setNewName("");
  };
  const handleRemove = (i) => {
    if(usedDivs.has(list[i])) return;
    setList(prev=>prev.filter((_,idx)=>idx!==i));
  };
  const handleEdit = (i,v) => {
    setList(prev=>prev.map((d,idx)=>idx===i?v:d));
  };

  return (
    <div onClick={onClose} style={{ position:"fixed", inset:0, background:"var(--modal-overlay)", display:"flex", alignItems:"center", justifyContent:"center", zIndex:200, padding:16 }}>
      <div onClick={e=>e.stopPropagation()} style={{ background:"var(--bg-card)", borderRadius:18, maxWidth:440, width:"100%", maxHeight:"90vh", overflow:"auto", padding:"26px 22px", position:"relative" }}>
        <button onClick={onClose} style={{ position:"absolute", top:12, right:12, background:"var(--bg-secondary)", border:"none", fontSize:14, cursor:"pointer", color:"var(--text-muted)", width:28, height:28, borderRadius:"50%", display:"flex", alignItems:"center", justifyContent:"center" }}>✕</button>
        <h2 style={{ fontSize:17, fontWeight:800, color:"var(--text-primary)", margin:"0 0 16px" }}>🏢 Kelola Divisi</h2>

        {list.map((d,i)=>{
          const inUse = usedDivs.has(d);
          return (
            <div key={i} style={{ display:"flex", alignItems:"center", gap:8, marginBottom:8, padding:"8px 10px", background:"var(--bg-secondary)", borderRadius:10 }}>
              <input value={d} onChange={e=>handleEdit(i,e.target.value)} style={{...inputStyle, flex:1, padding:"6px 8px", fontSize:13}} />
              {inUse ? (
                <span style={{ fontSize:9, color:"var(--text-muted)", whiteSpace:"nowrap" }}>Dipakai</span>
              ) : (
                <button onClick={()=>handleRemove(i)} style={{ background:"none", border:"none", cursor:"pointer", color:"var(--danger)", fontSize:14, padding:4 }}>✕</button>
              )}
            </div>
          );
        })}

        <div style={{ display:"flex", alignItems:"center", gap:8, marginTop:12, padding:"10px", background:"var(--bg-secondary)", borderRadius:10, border:"1.5px dashed var(--text-subtle)" }}>
          <input value={newName} onChange={e=>setNewName(e.target.value)} placeholder="Nama divisi baru..." style={{...inputStyle, flex:1, padding:"6px 8px", fontSize:13}}
            onKeyDown={e=>e.key==="Enter"&&handleAdd()} />
          <button onClick={handleAdd} style={{ background:"var(--accent)", border:"none", color:"#fff", borderRadius:8, padding:"6px 14px", fontSize:12, fontWeight:700, cursor:"pointer", whiteSpace:"nowrap" }}>+ Tambah</button>
        </div>

        <div style={{ display:"flex", gap:8, marginTop:16 }}>
          <button onClick={()=>{onSave(list);onClose();}} style={{ flex:1, padding:"10px", borderRadius:10, border:"none", background:"var(--success)", color:"#fff", fontSize:13, fontWeight:700, cursor:"pointer" }}>💾 Simpan</button>
          <button onClick={onClose} style={{ flex:1, padding:"10px", borderRadius:10, border:"1.5px solid var(--border)", background:"var(--bg-card)", color:"var(--text-secondary)", fontSize:13, fontWeight:600, cursor:"pointer" }}>Batal</button>
        </div>
      </div>
    </div>
  );
}

/* ── User Management Modal ── */
function UserModal({ users, onClose, onSave }) {
  const PER_PAGE = 5;
  const [list, setList] = useState(users.map(u=>({...u})));
  const [newUser, setNewUser] = useState({ username:"", password:"", name:"", role:"viewer" });
  const [showPw, setShowPw] = useState({});
  const [expandedId, setExpandedId] = useState(null);
  const [searchUser, setSearchUser] = useState("");
  const [page, setPage] = useState(1);
  const [showConfirm, setShowConfirm] = useState(false);

  const hasChanges = JSON.stringify(list) !== JSON.stringify(users);

  const handleClose = () => {
    if (hasChanges) { setShowConfirm(true); }
    else onClose();
  };

  const handleAdd = () => {
    if(!newUser.username.trim() || !newUser.password.trim()) return;
    if(list.some(u=>u.username.toLowerCase()===newUser.username.trim().toLowerCase())) return;
    const id = "u"+Date.now();
    setList(prev=>[...prev, {...newUser, username:newUser.username.trim(), name:newUser.name.trim()||newUser.username.trim(), id, active:true}]);
    setNewUser({ username:"", password:"", name:"", role:"viewer" });
    setExpandedId(id);
    setPage(Math.ceil((list.length + 1) / PER_PAGE));
  };
  const handleToggleActive = (i) => {
    const u = list[i];
    if(u.active && u.role==="admin" && list.filter(x=>x.role==="admin"&&x.active).length<=1) return;
    setList(prev=>prev.map((x,idx)=>idx===i?{...x, active:!x.active}:x));
  };
  const handleEdit = (i,field,v) => {
    setList(prev=>prev.map((u,idx)=>idx===i?{...u,[field]:v}:u));
  };

  const [filterRole, setFilterRole] = useState("all");

  const filteredList = list.filter(u => {
    if (searchUser && !u.name.toLowerCase().includes(searchUser.toLowerCase()) && !u.username.toLowerCase().includes(searchUser.toLowerCase())) return false;
    if (filterRole !== "all" && u.role !== filterRole) return false;
    return true;
  });
  const totalPages = Math.max(1, Math.ceil(filteredList.length / PER_PAGE));
  const safePage = Math.min(page, totalPages);
  const pagedList = filteredList.slice((safePage - 1) * PER_PAGE, safePage * PER_PAGE);

  return (
    <div onClick={handleClose} style={{ position:"fixed", inset:0, background:"var(--modal-overlay)", display:"flex", alignItems:"center", justifyContent:"center", zIndex:200, padding:16 }}>
      <div onClick={e=>e.stopPropagation()} style={{ background:"var(--bg-card)", borderRadius:18, maxWidth:520, width:"100%", maxHeight:"90vh", overflow:"auto", padding:"26px 22px", position:"relative" }}>
        <button onClick={handleClose} style={{ position:"absolute", top:12, right:12, background:"var(--bg-secondary)", border:"none", fontSize:14, cursor:"pointer", color:"var(--text-muted)", width:28, height:28, borderRadius:"50%", display:"flex", alignItems:"center", justifyContent:"center" }}>✕</button>
        <h2 style={{ fontSize:17, fontWeight:800, color:"var(--text-primary)", margin:"0 0 12px" }}>👤 Kelola User</h2>

        <div style={{ marginBottom:14, padding:"12px", background:"var(--bg-secondary)", borderRadius:10, border:"1.5px dashed var(--text-subtle)" }}>
          <div style={{ fontSize:10, fontWeight:600, color:"var(--text-muted)", marginBottom:8 }}>TAMBAH USER BARU</div>
          <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:6, marginBottom:8 }}>
            <div>
              <label style={{ fontSize:9, color:"var(--text-muted)", fontWeight:600 }}>NAMA</label>
              <input value={newUser.name} onChange={e=>setNewUser(p=>({...p,name:e.target.value}))} placeholder="Nama" style={{...inputStyle, padding:"6px 8px", fontSize:12}} />
            </div>
            <div>
              <label style={{ fontSize:9, color:"var(--text-muted)", fontWeight:600 }}>JENIS USER</label>
              <select value={newUser.role} onChange={e=>setNewUser(p=>({...p,role:e.target.value}))} style={{...inputStyle, padding:"6px 8px", fontSize:12}}>
                <option value="viewer">👁️ Viewer</option>
                <option value="admin">🔧 Admin</option>
              </select>
            </div>
            <div>
              <label style={{ fontSize:9, color:"var(--text-muted)", fontWeight:600 }}>USERNAME *</label>
              <input value={newUser.username} onChange={e=>setNewUser(p=>({...p,username:e.target.value}))} placeholder="Username" style={{...inputStyle, padding:"6px 8px", fontSize:12}} />
            </div>
            <div>
              <label style={{ fontSize:9, color:"var(--text-muted)", fontWeight:600 }}>PASSWORD *</label>
              <input type="password" value={newUser.password} onChange={e=>setNewUser(p=>({...p,password:e.target.value}))} placeholder="Password" style={{...inputStyle, padding:"6px 8px", fontSize:12}} />
            </div>

            if(!newUser.username.trim() || !newUser.password.trim()) return;

                      }} />
                    </div>
                  </div>
                </div>
              )}
            </div>
          );
        })}

        {filteredList.length === 0 && searchUser && (
          <div style={{ textAlign:"center", padding:16, color:"var(--text-subtle)", fontSize:12 }}>Tidak ada user yang cocok</div>
        )}

        {totalPages > 1 && (
          <div style={{ display:"flex", alignItems:"center", justifyContent:"center", gap:4, marginTop:10 }}>
            <button onClick={()=>setPage(p=>Math.max(1,p-1))} disabled={safePage<=1}
              style={{ fontSize:12, padding:"4px 10px", borderRadius:6, border:"1.5px solid var(--border)", background:safePage<=1?"var(--bg-secondary)":"var(--bg-card)", color:safePage<=1?"var(--text-subtle)":"var(--text-secondary)", cursor:safePage<=1?"default":"pointer", fontWeight:600 }}>‹</button>
            {Array.from({length:totalPages},(_,i)=>i+1).map(n=>(
              <button key={n} onClick={()=>setPage(n)} style={{
                fontSize:12, padding:"4px 10px", borderRadius:6, cursor:"pointer", fontWeight:600,
                border:n===safePage?"1.5px solid var(--accent)":"1.5px solid var(--border)",
                background:n===safePage?"var(--accent-bg)":"var(--bg-card)", color:n===safePage?"var(--accent)":"var(--text-secondary)",
              }}>{n}</button>
            ))}
            <button onClick={()=>setPage(p=>Math.min(totalPages,p+1))} disabled={safePage>=totalPages}
              style={{ fontSize:12, padding:"4px 10px", borderRadius:6, border:"1.5px solid var(--border)", background:safePage>=totalPages?"var(--bg-secondary)":"var(--bg-card)", color:safePage>=totalPages?"var(--text-subtle)":"var(--text-secondary)", cursor:safePage>=totalPages?"default":"pointer", fontWeight:600 }}>›</button>
          </div>
        )}

        {showConfirm && (
          <div style={{ position:"absolute", inset:0, background:"rgba(255,255,255,0.92)", borderRadius:18, display:"flex", alignItems:"center", justifyContent:"center", zIndex:10 }}>
            <div style={{ background:"var(--bg-card)", borderRadius:14, padding:"24px 20px", boxShadow:"0 4px 20px rgba(0,0,0,0.12)", maxWidth:320, width:"100%", textAlign:"center" }}>
              <div style={{ fontSize:28, marginBottom:8 }}>💾</div>
              <div style={{ fontSize:14, fontWeight:700, color:"var(--text-primary)", marginBottom:4 }}>Ada perubahan belum disimpan</div>
              <div style={{ fontSize:12, color:"var(--text-secondary)", marginBottom:16 }}>Simpan perubahan sebelum keluar?</div>
              <div style={{ display:"flex", gap:8 }}>
                <button onClick={()=>{onSave(list);onClose();}} style={{ flex:1, padding:"10px", borderRadius:10, border:"none", background:"var(--success)", color:"#fff", fontSize:13, fontWeight:700, cursor:"pointer" }}>Simpan</button>
                <button onClick={onClose} style={{ flex:1, padding:"10px", borderRadius:10, border:"1.5px solid var(--border)", background:"var(--bg-card)", color:"var(--text-secondary)", fontSize:13, fontWeight:600, cursor:"pointer" }}>Buang</button>
                <button onClick={()=>setShowConfirm(false)} style={{ flex:1, padding:"10px", borderRadius:10, border:"1.5px solid var(--border)", background:"var(--bg-card)", color:"var(--text-secondary)", fontSize:13, fontWeight:600, cursor:"pointer" }}>Kembali</button>
              </div>
            </div>
          </div>
        )}

      </div>
    </div>
  );
}

function App() {
  const [users, setUsers] = useState(INIT_USERS);
  const [currentUser, _setCurrentUser] = useState(() => {
    try { const s = localStorage.getItem('pantau-session'); return s ? JSON.parse(s) : null; } catch(e) { return null; }

    _setCurrentUser(u);

  const [loaded, setLoaded] = useState(false);

  const [demoMode, setDemoMode] = useState(false);
  const [notifications, setNotifications] = useState([]);

  const [toasts, setToasts] = useState([]);
  const [activityLog, setActivityLog] = useState([]);
  const [showActivityLog, setShowActivityLog] = useState(false);
