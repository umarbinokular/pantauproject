  const [analyticRange, setAnalyticRange] = useState("all");

  const addLog = async (action, taskName, detail, user) => {
    const entry = { id: Date.now()+Math.random(), action, taskName, detail, user: user || currentUser?.name || "System", time: new Date().toLocaleString("id-ID", { day:"numeric", month:"short", year:"numeric", hour:"2-digit", minute:"2-digit" }) };
    setActivityLog(prev => [entry, ...prev].slice(0, 200));
    if (!demoMode) {
      try { await DB.addActivityLog(entry); } catch(e) { console.error('Save log error:', e); }
    }
  };


  // Viewer: hanya lihat notifikasi dari card yang pernah dia komentari & bukan komentar sendiri
  // Admin: lihat semua notifikasi
  const visibleNotifications = useMemo(() => {
    if (!currentUser) return [];
    if (currentUser.role === "admin") return notifications;
    const myName = currentUser.name;
    // Cari card-card yang pernah dikomentari viewer ini
    const myCardIds = new Set();
    projects.forEach(p => {
      if (p.comments && p.comments.some(c => c.user === myName)) {
        myCardIds.add(p.id);
      }
    });
    return notifications.filter(n => n.taskId && myCardIds.has(n.taskId) && n.user !== myName);
  }, [notifications, currentUser, projects]);

  const unreadCount = visibleNotifications.filter(n => !n.read).length;

  const addNotification = async (notif) => {
    const entry = { ...notif, id: Date.now(), read: false };
    setNotifications(prev => [entry, ...prev]);
    // Toast: admin selalu lihat, viewer hanya jika card pernah dikomentari & bukan komentar sendiri
    const myName = currentUser?.name;
    const isAdminUser = currentUser?.role === "admin";
    if (isAdminUser || notif.user !== myName) {
      const myCardIds = new Set();
      projects.forEach(p => {
        if (p.comments && p.comments.some(c => c.user === myName)) myCardIds.add(p.id);
      });
      if (isAdminUser || myCardIds.has(notif.taskId)) {
        setToasts(prev => [...prev, { id: entry.id, taskId: notif.taskId, title: `${notif.user} berkomentar`, body: `"${notif.text.length > 50 ? notif.text.slice(0,50)+'...' : notif.text}" — ${notif.taskName}` }]);
      }
    }
    // Simpan ke database — kirim ke semua user yang relevan
    if (!demoMode) {
      try {
        const allUsers = users.filter(u => u.active !== false).map(u => u.name);
        // Untuk notifikasi komentar: kirim ke semua user kecuali pengirim
        const forUsers = allUsers.filter(u => u !== notif.user);
        if (forUsers.length > 0) await DB.addNotification(notif, forUsers);
      } catch(e) { console.error('Save notification error:', e); }
    }
  };
  const clearNotifications = async () => {
    setNotifications([]);
    if (!demoMode && currentUser) {
      try { await DB.clearNotifications(currentUser.name); } catch(e) {}
    }
  };
  const markAllRead = async () => {
    setNotifications(prev => prev.map(n => ({ ...n, read: true })));
    if (!demoMode && currentUser) {
      try { await DB.markAllNotifsRead(currentUser.name); } catch(e) {}
    }
  };
  const markOneRead = async (notifId) => {
    setNotifications(prev => prev.map(n => n.id === notifId ? { ...n, read: true } : n));
    if (!demoMode) {
      try { await DB.markNotifRead(notifId); } catch(e) {}
    }
  };
  const openNotifPanel = () => {
    setShowNotifPanel(true);
  };

  const isAdmin = currentUser?.role === "admin";

  // Dark mode
  const [darkMode, setDarkMode] = useState(() => {
    try { return localStorage.getItem('pantau-theme') === 'dark'; } catch(e) { return false; }
  });
  useEffect(() => {
    document.documentElement.setAttribute('data-theme', darkMode ? 'dark' : 'light');
  }, [darkMode]);
  const toggleTheme = () => {
    const next = !darkMode;
    setDarkMode(next);
    try { localStorage.setItem('pantau-theme', next ? 'dark' : 'light'); } catch(e) {}
  };

  // Division name ↔ id mappings
  const [divIdMap, setDivIdMap] = useState({});
  const [divNameToId, setDivNameToId] = useState({});

  // Enter demo mode
  const enterDemo = () => {
    setDemoMode(true);
    setDivs(DEMO_DIVS);
    setUsers(DEMO_USERS);
    setProjects(DEMO_PROJECTS.map(p => autoCalc(p)));
    setCurrentUser(DEMO_USERS[0]); // login as admin demo
    setLoaded(true);
    setLoadError(null);
    // Pre-populate sample notifications from recent comments
    const demoNotifs = [
      { id:1, user:"Admin Demo", text:"Delay karena issue kompatibilitas schema lama", time:"25 Okt 2026, 08:00", taskName:"Pipeline Data Warehouse", taskId:"d5", read:false },
      { id:2, user:"Viewer Demo", text:"Referensi UI sudah dikumpulkan di Figma", time:"25 Okt 2026, 11:45", taskName:"Mobile App MVP", taskId:"d7", read:false },
      { id:3, user:"Admin Demo", text:"Gunakan React Native 0.73+, jangan Expo", time:"25 Okt 2026, 09:00", taskName:"Mobile App MVP", taskId:"d7", read:false },
      { id:4, user:"Admin Demo", text:"UAT masih perlu testing edge case refund", time:"24 Okt 2026, 09:00", taskName:"Integrasi Payment Gateway", taskId:"d2", read:true },
      { id:5, user:"Viewer Demo", text:"Sudah siapkan aset gambar produk", time:"24 Okt 2026, 09:30", taskName:"Landing Page Produk Baru", taskId:"d3", read:true },
      { id:6, user:"Admin Demo", text:"Tambahkan CTA yang lebih jelas di email ke-3", time:"23 Okt 2026, 10:00", taskName:"Kampanye Email Marketing Q4", taskId:"d4", read:true },
      { id:7, user:"Viewer Demo", text:"Sudah cek wireframe, looks good!", time:"21 Okt 2026, 14:15", taskName:"Redesign Dashboard Analytics", taskId:"d1", read:true },
      { id:8, user:"Admin Demo", text:"Pastikan chart bisa di-zoom untuk data harian", time:"20 Okt 2026, 10:30", taskName:"Redesign Dashboard Analytics", taskId:"d1", read:true },
    ];
    setNotifications(demoNotifs);
    // Pre-populate sample activity log
    setActivityLog([
      { id:101, action:"move", taskName:"Integrasi Payment Gateway", detail:"Dipindahkan ke 🔍 Review", user:"Admin Demo", time:"24 Okt 2026, 08:30" },
      { id:102, action:"edit", taskName:"Pipeline Data Warehouse", detail:"Mengubah: deadline, milestone", user:"Admin Demo", time:"23 Okt 2026, 16:00" },
      { id:103, action:"edit", taskName:"Redesign Dashboard Analytics", detail:"Mengubah: milestone", user:"Viewer Demo", time:"23 Okt 2026, 11:00" },
      { id:104, action:"add", taskName:"Mobile App MVP", detail:"Task baru dibuat", user:"Admin Demo", time:"22 Okt 2026, 09:00" },
      { id:105, action:"move", taskName:"Dokumentasi API v2", detail:"Dipindahkan ke ✅ Selesai", user:"Admin Demo", time:"20 Okt 2026, 14:30" },
      { id:106, action:"edit", taskName:"Kampanye Email Marketing Q4", detail:"Mengubah: deskripsi, prioritas", user:"Admin Demo", time:"19 Okt 2026, 10:15" },
      { id:107, action:"move", taskName:"Social Media Report Automation", detail:"Dipindahkan ke ✅ Selesai", user:"Admin Demo", time:"15 Sep 2026, 16:00" },
      { id:108, action:"add", taskName:"Landing Page Produk Baru", detail:"Task baru dibuat", user:"Admin Demo", time:"15 Sep 2026, 09:00" },
      { id:109, action:"archive", taskName:"Legacy CRM Migration", detail:"Task diarsipkan", user:"Admin Demo", time:"01 Jul 2026, 10:00" },
      { id:110, action:"archive", taskName:"Internal Wiki Setup", detail:"Task diarsipkan", user:"Admin Demo", time:"20 Jul 2026, 14:30" },
    ]);
  };

  // Exit demo mode
  const exitDemo = () => {
    setDemoMode(false);
    setCurrentUser(null);
    setDivs(INIT_DIVS);
    setUsers(INIT_USERS);
    setProjects(initProjects);
    setLoaded(false);
    setNotifications([]);
    setActivityLog([]);
    loadData();
  };

  // Load data from Supabase
  const loadData = useCallback(async () => {
    try {
      const divData = await DB.getDivisions();
      const idMap = {};
      const nameMap = {};
      divData.forEach(d => { idMap[d.id] = d.name; nameMap[d.name] = d.id; });
      setDivIdMap(idMap);
      setDivNameToId(nameMap);
      setDivs(divData.map(d => d.name));

      const projectData = await DB.getProjects(idMap);
      setProjects(projectData.map(p => autoCalc(p)));

      const userData = await DB.getUsers();
      if (userData.length > 0) setUsers(userData);

      // Load activity log dari DB
      try {
        const logData = await DB.getActivityLog();
        setActivityLog(logData);
      } catch(e) { console.error('Load activity log error:', e); }

      setLoaded(true);
    } catch (err) {
      console.error('Supabase load error:', err);
      setLoadError('Gagal koneksi ke Supabase. Periksa URL dan API Key.');
      setLoaded(true);
    }
  }, []);

  useEffect(() => { if (!demoMode) loadData(); }, [loadData, demoMode]);

  // Load notifications dari DB saat user login
  useEffect(() => {
    if (!demoMode && currentUser) {
      (async () => {
        try {
          const notifData = await DB.getNotifications(currentUser.name);
          // Filter: hanya notifikasi untuk user ini
          const myNotifs = notifData.filter(n => n._forUser === currentUser.name);
          setNotifications(myNotifs);
        } catch(e) { console.error('Load notifications error:', e); }
      })();
    }
  }, [currentUser, demoMode]);

  const [filterHealth, setFilterHealth] = useState("all");
  const [filterDiv, setFilterDiv] = useState("all");
  const [filterPriority, setFilterPriority] = useState("all");
  const [search, setSearch] = useState("");
  const [filterDateFrom, setFilterDateFrom] = useState("");
  const [filterDateTo, setFilterDateTo] = useState("");
  const [datePreset, setDatePreset] = useState("");
  const [showAllCompleted, setShowAllCompleted] = useState(false);
  const COMPLETED_LIMIT = 5;
  const [dragOverCol, setDragOverCol] = useState(null);
  const [dropTarget, setDropTarget] = useState(null);
  const dragId = useRef(null);

  const onDragStart = (e, id) => { dragId.current = id; e.dataTransfer.effectAllowed = "move"; setTimeout(()=>{e.target.style.opacity="0.4";},0); };
  const onDragEnd = (e) => { e.target.style.opacity = "1"; setDragOverCol(null); setDropTarget(null); };

  const onCardDragOver = (e, phaseId, index) => {
    e.preventDefault(); e.stopPropagation();
    e.dataTransfer.dropEffect = "move";
    const rect = e.currentTarget.getBoundingClientRect();
    const midY = rect.top + rect.height / 2;
    const insertIdx = e.clientY < midY ? index : index + 1;
    setDragOverCol(phaseId);
    setDropTarget({phase: phaseId, index: insertIdx});
  };

  const onColDragOver = (e, phaseId, cardCount) => {
    e.preventDefault();
    e.dataTransfer.dropEffect = "move";
    setDragOverCol(phaseId);
    if (!dropTarget || dropTarget.phase !== phaseId) {
      setDropTarget({phase: phaseId, index: cardCount});
    }
  };

  const onDragLeave = (e) => {
    const related = e.relatedTarget;
    if (!e.currentTarget.contains(related)) {
      setDragOverCol(null);
      setDropTarget(null);
    }
  };

  const onDrop = (e, targetPhase) => {
    e.preventDefault();
    setDragOverCol(null);
    const id = dragId.current;
    const target = dropTarget;
    setDropTarget(null);
    if (!id) return;

    setProjects(prev => {
      const targetCards = prev.filter(p => p.phase === targetPhase && p.id !== id);
      const otherCards = prev.filter(p => p.phase !== targetPhase && p.id !== id);
      const draggedCard = prev.find(p => p.id === id);
      if (!draggedCard) return prev;

      const updated = autoCalc({...draggedCard}, targetPhase);
      const insertIdx = target ? Math.min(target.index, targetCards.length) : targetCards.length;
      targetCards.splice(insertIdx, 0, updated);

      if (!demoMode) DB.saveProject(updated, divNameToId);

      return [...otherCards, ...targetCards];
    });
    dragId.current = null;
  };

  const handleSave = async (updated) => {
    const calculated = autoCalc(updated);
    const old = projects.find(x => x.id === calculated.id);
    if (!demoMode) await DB.saveProject(calculated, divNameToId);
    setProjects(prev => prev.map(p => p.id === calculated.id ? calculated : p));
    setSelected(calculated);
    if (old) {
      const changes = [];
      if (old.name !== calculated.name) changes.push("nama");
      if (old.summary !== calculated.summary) changes.push("deskripsi");
      if (old.priority !== calculated.priority) changes.push("prioritas");
      if (old.deadline !== calculated.deadline) changes.push("deadline");
      if (old.requirements !== calculated.requirements) changes.push("requirements");
      if (JSON.stringify(old.comments) !== JSON.stringify(calculated.comments)) {
        if ((calculated.comments||[]).length > (old.comments||[]).length) changes.push("komentar baru");
        else if ((calculated.comments||[]).length < (old.comments||[]).length) changes.push("hapus komentar");
        else changes.push("edit komentar");
      }
      if (JSON.stringify(old.milestones) !== JSON.stringify(calculated.milestones)) changes.push("milestone");
      if (changes.length > 0) addLog("edit", calculated.name, "Mengubah: " + changes.join(", "));
    }
  };

  const handleDelete = async (id) => {
    const p = projects.find(x => x.id === id);
    if (p) addLog("delete", p.name, "Task dihapus");
    if (!demoMode && p && p._dbId) await DB.deleteProject(p._dbId);
    setProjects(prev => prev.filter(p => p.id !== id));
    setSelected(null);
  };

  const handleAdd = async (project) => {
    const calculated = autoCalc(project);
    if (!demoMode) {
      const saved = await DB.saveProject(calculated, divNameToId);
      setProjects(prev => [...prev, saved]);
      setOpenInEdit(true);
      setSelected(saved);
      addLog("add", saved.name, "Task baru dibuat");
    } else {
      const demoSaved = { ...calculated, id: 'd' + Date.now() };
      setProjects(prev => [...prev, demoSaved]);
      setOpenInEdit(true);
      setSelected(demoSaved);
      addLog("add", demoSaved.name, "Task baru dibuat");
    }
  };

  const handleMove = async (id, targetPhase) => {
    const card = projects.find(p => p.id === id);
    const phaseLabel = PHASES.find(ph => ph.id === targetPhase)?.l || targetPhase;
    if (card) addLog("move", card.name, `Dipindahkan ke ${phaseLabel}`);
    setProjects(prev => {
      const c = prev.find(p => p.id === id);
      if (!c) return prev;
      const updated = autoCalc({...c}, targetPhase);
      if (!demoMode) DB.saveProject(updated, divNameToId);
      return prev.map(p => p.id === id ? updated : p);
    });
  };

  // ─── Archive handlers ───
  const handleArchive = async (id) => {
    const card = projects.find(p => p.id === id);
    if (!card) return;
    const prevPhase = card.phase;
    const updated = { ...card, _archived: true, _prevPhase: prevPhase, phase: 'archived', _manualPhase: 'archived' };
    setProjects(prev => prev.map(p => p.id === id ? updated : p));
    setSelected(null);
    addLog("archive", card.name, "Task diarsipkan");
    addNotification({ type:"action", user: currentUser.name, text: "Task diarsipkan", taskName: card.name, taskId: card.id });
    if (!demoMode && card._dbId) {
      await DB.archiveProject(card._dbId, prevPhase);
    }
  };

  const handleRestore = async (id) => {
    const card = projects.find(p => p.id === id);
    if (!card) return;
    const targetPhase = card._prevPhase || 'initiation';
    const restoredLabel = PHASES.find(ph => ph.id === targetPhase)?.l || targetPhase;
    const updated = autoCalc({ ...card, _archived: false, _prevPhase: null, phase: targetPhase, _manualPhase: targetPhase });
    setProjects(prev => prev.map(p => p.id === id ? updated : p));
    addLog("restore", card.name, `Task dipulihkan dari arsip ke ${restoredLabel}`);
    addNotification({ type:"action", user: currentUser.name, text: `Task dipulihkan dari arsip ke ${restoredLabel}`, taskName: card.name, taskId: card.id });
    if (!demoMode && card._dbId) {
      await DB.restoreProject(card._dbId, targetPhase);
    }
  };

  const handleDeletePermanent = async (id) => {
    const card = projects.find(p => p.id === id);
    if (!card) return;
    addLog("delete", card.name, "Project dihapus permanen dari arsip");
    addNotification({ type:"action", user: currentUser.name, text: "Project dihapus permanen dari arsip", taskName: card.name, taskId: card.id });
    if (!demoMode && card._dbId) await DB.deleteProject(card._dbId);
    setProjects(prev => prev.filter(p => p.id !== id));
  };

  const archivedProjects = projects.filter(p => p._archived);

  const handleSaveDivs = async (newDivs) => {
    setDivs(newDivs);
    if (!demoMode) {
      await DB.saveDivisions(newDivs);
      const divData = await DB.getDivisions();
      const idMap = {};
      const nameMap = {};
      divData.forEach(d => { idMap[d.id] = d.name; nameMap[d.name] = d.id; });
      setDivIdMap(idMap);
      setDivNameToId(nameMap);
    }
  };

  const handleSaveUsers = async (updatedUsers) => {
    setUsers(updatedUsers);
    if (!demoMode) await DB.saveUsers(updatedUsers);
  };

  const handleResetAdmin = async () => {
    if (!demoMode) await DB.resetAdmin();
  };

  const parseDate = (dl) => {
    try { const d = new Date(dl); return isNaN(d.getTime()) ? null : d; } catch { return null; }
  };
  const filtered = projects.filter(p => {
    if (p._archived) return false;
    if (filterHealth !== "all" && p.health !== filterHealth) return false;
    if (filterDiv !== "all" && p.div !== filterDiv) return false;
    if (filterPriority !== "all" && p.priority !== filterPriority) return false;
    if (search && !p.name.toLowerCase().includes(search.toLowerCase()) && !p.div.toLowerCase().includes(search.toLowerCase())) return false;
    if (filterDateFrom || filterDateTo) {
      const pStart = parseDate(p.start);
      const pEnd = parseDate(p.deadline);
      const from = filterDateFrom ? new Date(filterDateFrom) : null;
      const to = filterDateTo ? new Date(filterDateTo) : null;
      if (from && pEnd && pEnd < from) return false;
      if (to && pStart && pStart > to) return false;
    }
    return true;
  });

  const divisions = divs;
  const activeProjects = projects.filter(p => !p._archived);
  const priorityCount = activeProjects.filter(p=>p.priority==='priority').length;
  const normalCount = activeProjects.filter(p=>p.priority!=='priority').length;

  if (!currentUser) return <LoginScreen onLogin={setCurrentUser} onResetAdmin={handleResetAdmin} onDemo={enterDemo} />;

  return (
    <div style={{ fontFamily:"'Inter',-apple-system,sans-serif", background:"var(--bg-main)", minHeight:"100vh", transition:"background .3s" }}>

      {/* Demo mode banner */}
      {demoMode && (
        <div style={{ background:"linear-gradient(135deg, #6C7AE0, #9F7AEA)", color:"#fff", padding:"8px 20px", fontSize:12, fontWeight:600, textAlign:"center", display:"flex", alignItems:"center", justifyContent:"center", gap:12 }}>
          <span>🎯 Mode Demo — Data yang ditampilkan adalah sample dan tidak tersimpan</span>
          <button onClick={exitDemo} style={{ fontSize:11, fontWeight:700, padding:"4px 12px", borderRadius:6, border:"1.5px solid rgba(255,255,255,0.5)", background:"rgba(255,255,255,0.15)", color:"#fff", cursor:"pointer" }}>Keluar Demo</button>
        </div>
      )}

      {/* Connection error banner */}
      {loadError && !demoMode && (
        <div style={{ background:"var(--danger-border)", color:"#9B2C2C", padding:"10px 20px", fontSize:12, fontWeight:600, textAlign:"center" }}>
          ⚠️ {loadError}
        </div>
      )}

      {/* Header */}
      <div style={{ background:"var(--bg-card)", padding:"14px 20px", borderBottom:"1.5px solid var(--border-light)", display:"flex", alignItems:"center", justifyContent:"space-between", flexWrap:"wrap", gap:8 }}>
        <h1 style={{ fontSize:17, fontWeight:800, color:"var(--text-primary)", margin:0 }}>Pantau Project</h1>
        <div style={{ display:"flex", alignItems:"center", gap:8, flexWrap:"wrap" }}>
          <button onClick={toggleTheme} style={{
            fontSize:12, fontWeight:600, padding:"6px 12px", borderRadius:8, border:"1.5px solid var(--border)",
            background:"var(--bg-secondary)", color:"var(--text-secondary)", cursor:"pointer",
            display:"flex", alignItems:"center", gap:4,
          }}>
            {darkMode ? "☀️ Light" : "🌙 Dark"}
          </button>
          {isAdmin && (
            <button onClick={()=>setShowUserModal(true)} style={{ fontSize:12, fontWeight:600, padding:"6px 14px", borderRadius:8, border:"1.5px solid var(--border)", background:"var(--bg-card)", color:"var(--text-secondary)", cursor:"pointer" }}>👤 Kelola User</button>
          )}
          {isAdmin && (
            <button onClick={()=>setShowDivModal(true)} style={{ fontSize:12, fontWeight:600, padding:"6px 14px", borderRadius:8, border:"1.5px solid var(--border)", background:"var(--bg-card)", color:"var(--text-secondary)", cursor:"pointer" }}>🏢 Kelola Divisi</button>
          )}
          <button onClick={openNotifPanel} style={{
            position:"relative", fontSize:14, padding:"5px 10px", borderRadius:8, border:"1.5px solid var(--border)",
            background:"var(--bg-card)", cursor:"pointer", display:"flex", alignItems:"center", gap:4, color:"var(--text-secondary)",
          }}>
            🔔
            {unreadCount > 0 && (
              <span style={{
                position:"absolute", top:-4, right:-4, background:"#E53E3E", color:"#fff", fontSize:9, fontWeight:800,
                minWidth:16, height:16, borderRadius:8, display:"flex", alignItems:"center", justifyContent:"center", padding:"0 4px",
              }}>{unreadCount}</span>
            )}
          </button>

          <button onClick={()=>setShowAnalytics(true)} style={{
            fontSize:14, padding:"5px 10px", borderRadius:8, border:"1.5px solid var(--border)",
            background:"var(--bg-card)", cursor:"pointer", display:"flex", alignItems:"center", gap:4, color:"var(--text-secondary)",
          }} title="Analytics">📊</button>
          {isAdmin && (
          <button onClick={()=>setShowActivityLog(true)} style={{
            fontSize:14, padding:"5px 10px", borderRadius:8, border:"1.5px solid var(--border)",
            background:"var(--bg-card)", cursor:"pointer", display:"flex", alignItems:"center", gap:4, color:"var(--text-secondary)",
          }} title="Activity Log">📋</button>
          )}
          {isAdmin && (
            <button onClick={()=>setShowArchive(true)} style={{
              position:"relative", fontSize:14, padding:"5px 10px", borderRadius:8, border:"1.5px solid var(--border)",
              background:"var(--bg-card)", cursor:"pointer", display:"flex", alignItems:"center", gap:4, color:"var(--text-secondary)",
            }} title="Arsip">
              📦
              {archivedProjects.length > 0 && (
                <span style={{
                  position:"absolute", top:-4, right:-4, background:"var(--text-muted)", color:"#fff", fontSize:9, fontWeight:800,
                  minWidth:16, height:16, borderRadius:8, display:"flex", alignItems:"center", justifyContent:"center", padding:"0 4px",
                }}>{archivedProjects.length}</span>
              )}
            </button>
          )}
          <div style={{ display:"flex", alignItems:"center", gap:6, padding:"4px 12px", background:"var(--bg-secondary)", borderRadius:8 }}>
            <span style={{ fontSize:12, fontWeight:600, color:"var(--text-primary)" }}>{currentUser.name}</span>
          </div>
          <button onClick={()=>setCurrentUser(null)} style={{ fontSize:12, fontWeight:600, padding:"6px 14px", borderRadius:8, border:"1.5px solid var(--danger-border)", background:"var(--danger-bg)", color:"var(--danger)", cursor:"pointer" }}>Keluar</button>
        </div>
      </div>

      {/* Filters + Health status */}
      <div style={{ padding:"8px 20px", display:"flex", alignItems:"center", gap:8, flexWrap:"wrap", background:"var(--bg-card)", borderBottom:"1.5px solid var(--border-light)" }}>
        <input type="text" placeholder="🔍 Cari..." value={search} onChange={e=>setSearch(e.target.value)}
          style={{ fontSize:12, padding:"6px 10px", borderRadius:8, border:"1.5px solid var(--border-light)", outline:"none", width:140, background:"var(--bg-secondary)", color:"var(--text-primary)" }} />
        <div style={{ display:"flex", alignItems:"center", gap:4 }}>
          <select value={datePreset} onChange={e=>{
            const v = e.target.value;
            setDatePreset(v);
            const now = new Date();
            const y = now.getFullYear();
            const fmt = d => d.toISOString().split("T")[0];
            if(v==="") { setFilterDateFrom(""); setFilterDateTo(""); }
            else if(v==="q1") { setFilterDateFrom(fmt(new Date(y,0,1))); setFilterDateTo(fmt(new Date(y,2,31))); }
            else if(v==="q2") { setFilterDateFrom(fmt(new Date(y,3,1))); setFilterDateTo(fmt(new Date(y,5,30))); }
            else if(v==="q3") { setFilterDateFrom(fmt(new Date(y,6,1))); setFilterDateTo(fmt(new Date(y,8,30))); }
            else if(v==="q4") { setFilterDateFrom(fmt(new Date(y,9,1))); setFilterDateTo(fmt(new Date(y,11,31))); }
            else if(v==="this_year") { setFilterDateFrom(fmt(new Date(y,0,1))); setFilterDateTo(fmt(new Date(y,11,31))); }
            else if(v==="last_year") { setFilterDateFrom(fmt(new Date(y-1,0,1))); setFilterDateTo(fmt(new Date(y-1,11,31))); }
            else if(v==="custom") {}
          }} style={{ fontSize:11, padding:"6px 8px", borderRadius:8, border:"1.5px solid var(--border-light)", background:"var(--bg-secondary)", cursor:"pointer", color:"var(--text-secondary)" }}>
            <option value="">📅 Semua Periode</option>
            <option value="q1">Kwartal 1 (Jan–Mar)</option>
            <option value="q2">Kwartal 2 (Apr–Jun)</option>
            <option value="q3">Kwartal 3 (Jul–Sep)</option>
            <option value="q4">Kwartal 4 (Okt–Des)</option>
            <option value="this_year">Tahun ini</option>
            <option value="last_year">Tahun lalu</option>
            <option value="custom">Pilih tanggal...</option>
          </select>
          {(datePreset==="custom" || filterDateFrom || filterDateTo) && (
            <>
              <input type="date" value={filterDateFrom} onChange={e=>{setFilterDateFrom(e.target.value);setDatePreset("custom");}} title="Dari tanggal"
                style={{ fontSize:11, padding:"6px 8px", borderRadius:8, border:"1.5px solid var(--border-light)", outline:"none", background:"var(--bg-secondary)", cursor:"pointer", color:"var(--text-secondary)" }} />
              <span style={{ fontSize:11, color:"var(--text-muted)" }}>—</span>
              <input type="date" value={filterDateTo} onChange={e=>{setFilterDateTo(e.target.value);setDatePreset("custom");}} title="Sampai tanggal"
                style={{ fontSize:11, padding:"6px 8px", borderRadius:8, border:"1.5px solid var(--border-light)", outline:"none", background:"var(--bg-secondary)", cursor:"pointer", color:"var(--text-secondary)" }} />
            </>
          )}
          {(filterDateFrom || filterDateTo) && (
            <button onClick={()=>{setFilterDateFrom("");setFilterDateTo("");setDatePreset("");}} style={{ fontSize:11, padding:"5px 8px", borderRadius:8, border:"1.5px solid var(--danger-border)", background:"var(--danger-bg)", color:"var(--danger)", cursor:"pointer", fontWeight:600 }}>✕</button>
          )}
        </div>
        <select value={filterDiv} onChange={e=>setFilterDiv(e.target.value)}
          style={{ fontSize:12, padding:"6px 8px", borderRadius:8, border:"1.5px solid var(--border-light)", background:"var(--bg-secondary)", cursor:"pointer", color:"var(--text-secondary)" }}>
          <option value="all">Semua Divisi</option>
          {divisions.map(d=><option key={d} value={d}>{d}</option>)}
        </select>

        {/* Priority filter */}
        <div style={{ display:"flex", alignItems:"center", gap:4 }}>
          <button onClick={()=>setFilterPriority(filterPriority==="priority"?"all":"priority")} style={{
            fontSize:10, fontWeight:600, padding:"4px 10px", borderRadius:8, cursor:"pointer", transition:"all .15s",
            border: filterPriority==="priority" ? "1.5px solid #E53E3E" : "1.5px solid var(--border)",
            background: filterPriority==="priority" ? "var(--priority-badge-bg)" : "var(--bg-card)",
            color: filterPriority==="priority" ? "var(--priority-badge-color)" : "var(--text-secondary)",
          }}>🔥 Prioritas ({priorityCount})</button>
          <button onClick={()=>setFilterPriority(filterPriority==="normal"?"all":"normal")} style={{
            fontSize:10, fontWeight:600, padding:"4px 10px", borderRadius:8, cursor:"pointer", transition:"all .15s",
            border: filterPriority==="normal" ? "1.5px solid var(--accent)" : "1.5px solid var(--border)",
            background: filterPriority==="normal" ? "var(--accent-bg)" : "var(--bg-card)",
            color: filterPriority==="normal" ? "var(--accent)" : "var(--text-secondary)",
          }}>📁 Reguler ({normalCount})</button>
        </div>

        <div style={{ marginLeft:"auto", display:"flex", alignItems:"center", gap:4, flexWrap:"wrap" }}>
          <button onClick={()=>setFilterHealth("all")} style={{
            fontSize:10, fontWeight:600, padding:"4px 10px", borderRadius:8, cursor:"pointer", transition:"all .15s",
            border: filterHealth==="all" ? "1.5px solid var(--accent)" : "1.5px solid var(--border)",
            background: filterHealth==="all" ? "var(--accent-bg)" : "var(--bg-card)",
            color: filterHealth==="all" ? "var(--accent)" : "var(--text-secondary)",
          }}>Semua ({projects.length})</button>
          {Object.entries(H).map(([k,v])=>{
            const cnt = projects.filter(p=>p.health===k).length;
            return (
              <button key={k} onClick={()=>setFilterHealth(filterHealth===k?"all":k)} style={{
                fontSize:10, fontWeight:600, padding:"4px 10px", borderRadius:8, cursor:"pointer", transition:"all .15s",
                border: filterHealth===k ? `1.5px solid ${v.border}` : "1.5px solid var(--border)",
                background: filterHealth===k ? v.bg : "var(--bg-card)",
                color: filterHealth===k ? v.c : "var(--text-secondary)",
              }}>{v.e} {v.l} ({cnt})</button>
            );
          })}
        </div>
      </div>

      {/* Kanban columns */}
      <div style={{ padding:"12px 20px 40px", display:"flex", gap:12, overflowX:"auto", minHeight:"calc(100vh - 200px)" }}>
        {PHASES.map(ph => {
          const cards = filtered.filter(p => p.phase === ph.id);
          const isOver = isAdmin && dragOverCol === ph.id;
          // Sort: priority first
          const sortedCards = [...cards].sort((a,b) => {
            if (a.priority === 'priority' && b.priority !== 'priority') return -1;
            if (a.priority !== 'priority' && b.priority === 'priority') return 1;
            return 0;
          });
          return (
            <div key={ph.id}
              onDragOver={e => isAdmin && onColDragOver(e, ph.id, sortedCards.length)}
              onDragLeave={onDragLeave}
              onDrop={e => isAdmin && onDrop(e, ph.id)}
              style={{ flex:"1 0 260px", maxWidth:340, minWidth:260 }}
            >
              <div style={{ background:"var(--bg-card)", borderRadius:"12px 12px 0 0", padding:"10px 14px", borderBottom:"2px solid var(--border-light)", display:"flex", alignItems:"center", justifyContent:"space-between" }}>
                <div>
                  <div style={{ fontSize:13, fontWeight:700, color:"var(--text-primary)" }}>{ph.l}</div>
                  <div style={{ fontSize:10, color:"var(--text-muted)" }}>{ph.n}</div>
                </div>
                <div style={{ display:"flex", alignItems:"center", gap:6 }}>
                  <span style={{ fontSize:13, fontWeight:700, background:"var(--bg-column)", color:"var(--text-secondary)", borderRadius:"50%", width:26, height:26, display:"flex", alignItems:"center", justifyContent:"center" }}>{cards.length}</span>
                  {isAdmin && (
                    <button onClick={()=>setAddPhase(ph.id)} title="Tambah project" style={{ background:"none", border:"1.5px solid var(--border)", borderRadius:"50%", width:26, height:26, display:"flex", alignItems:"center", justifyContent:"center", cursor:"pointer", fontSize:14, color:"var(--text-muted)", lineHeight:1 }}>+</button>
                  )}
                </div>
              </div>
              {(() => {
                const isCompleted = ph.id === "completed";
                const hiddenCount = isCompleted && !showAllCompleted ? Math.max(0, sortedCards.length - COMPLETED_LIMIT) : 0;
                const visibleCards = isCompleted && !showAllCompleted ? sortedCards.slice(0, COMPLETED_LIMIT) : sortedCards;
                return (
                  <div style={{
                    background: isOver ? "var(--accent-bg)" : "var(--bg-column)", borderRadius:"0 0 12px 12px", padding:"8px 8px 12px",
                    minHeight:120, transition:"background .15s", border: isOver ? "2px dashed var(--accent)" : "2px dashed transparent",
                  }}>
                    {visibleCards.map((p, idx) => (
                      <div key={p.id}>
                        {isAdmin && dropTarget && dropTarget.phase === ph.id && dropTarget.index === idx && dragId.current && dragId.current !== p.id && (
                          <div style={{ height:3, borderRadius:2, background:"var(--accent)", margin:"2px 4px 4px" }} />
                        )}
                        <div
                          onDragEnd={onDragEnd}
                          onDragOver={e => isAdmin && onCardDragOver(e, ph.id, idx)}
                        >
                          <Card p={p} onClick={setSelected} onDragStart={onDragStart} isAdmin={isAdmin} />
                        </div>
                      </div>
                    ))}
                    {isAdmin && dropTarget && dropTarget.phase === ph.id && dropTarget.index >= sortedCards.length && dragId.current && !sortedCards.find(c=>c.id===dragId.current && sortedCards.indexOf(c)===sortedCards.length-1) && (
                      <div style={{ height:3, borderRadius:2, background:"var(--accent)", margin:"2px 4px" }} />
                    )}
                    {isCompleted && sortedCards.length > COMPLETED_LIMIT && (
                      <button onClick={()=>setShowAllCompleted(!showAllCompleted)} style={{
                        width:"100%", padding:"8px", borderRadius:8, border:"1.5px dashed var(--text-subtle)",
                        background:"var(--bg-card)", color:"var(--text-secondary)", fontSize:11, fontWeight:600,
                        cursor:"pointer", marginTop:4, transition:"all .15s",
                      }}>
                        {showAllCompleted ? "⬆️ Sembunyikan" : `⬇️ Tampilkan ${hiddenCount} lainnya`}
                      </button>
                    )}
                    {sortedCards.length === 0 && (
                      <div style={{ textAlign:"center", padding:"28px 12px", color:"var(--text-subtle)", fontSize:12, border:"2px dashed var(--border)", borderRadius:10, background:"var(--bg-card)" }}>
                        {isAdmin ? "Geser card ke sini" : "Tidak ada project"}
                      </div>
                    )}
                  </div>
                );
              })()}
            </div>
          );
        })}
      </div>

      <Modal p={selected} onClose={()=>{setSelected(null);setOpenInEdit(false);}} onSave={handleSave} onMove={handleMove} onArchive={handleArchive} isAdmin={isAdmin} divs={divs} startInEdit={openInEdit} currentUser={currentUser} onNotify={addNotification} />
      {showNotifPanel && <NotifPanel notifications={visibleNotifications} onClose={()=>setShowNotifPanel(false)} onClear={clearNotifications} onMarkAllRead={markAllRead} onMarkOneRead={markOneRead} onClickNotif={(taskId)=>{
        setShowNotifPanel(false);
        const card = projects.find(p => p.id === taskId);
        if (card) { setSelected(card); setOpenInEdit(false); }
      }} />}
      {toasts.map(t => <Toast key={t.id} message={t} onDone={() => setToasts(prev => prev.filter(x => x.id !== t.id))} onClick={()=>{
        setToasts(prev => prev.filter(x => x.id !== t.id));
        const card = projects.find(p => p.id === t.taskId);
        if (card) { setSelected(card); setOpenInEdit(false); }
      }} />)}
      {showActivityLog && (
        <div style={{ position:"fixed", inset:0, background:"rgba(0,0,0,.45)", zIndex:9999, display:"flex", justifyContent:"center", alignItems:"center" }} onClick={()=>setShowActivityLog(false)}>
          <div onClick={e=>e.stopPropagation()} style={{ background:"var(--bg-card)", borderRadius:16, width:"90%", maxWidth:520, maxHeight:"80vh", display:"flex", flexDirection:"column", boxShadow:"0 20px 60px rgba(0,0,0,.25)" }}>
            <div style={{ padding:"16px 20px", borderBottom:"1.5px solid var(--border-light)", display:"flex", justifyContent:"space-between", alignItems:"center" }}>
              <span style={{ fontSize:14, fontWeight:700, color:"var(--text-primary)" }}>📋 Activity Log</span>
              <div style={{ display:"flex", gap:8, alignItems:"center" }}>
                {activityLog.length > 0 && <button onClick={async()=>{setActivityLog([]);if(!demoMode){try{await DB.clearActivityLog();}catch(e){}}}} style={{ fontSize:11, background:"none", border:"none", color:"var(--danger)", cursor:"pointer", fontWeight:600 }}>Hapus semua</button>}
                <button onClick={()=>setShowActivityLog(false)} style={{ background:"none", border:"none", fontSize:18, cursor:"pointer", color:"var(--text-muted)", lineHeight:1 }}>✕</button>
              </div>
            </div>
            <div style={{ padding:"12px 16px", overflowY:"auto", flex:1 }}>
              {activityLog.length === 0 ? (
                <div style={{ textAlign:"center", padding:30, color:"var(--text-muted)", fontSize:13 }}>Belum ada aktivitas</div>
              ) : activityLog.map(log => {
                const icon = log.action === "add" ? "➕" : log.action === "delete" ? "🗑️" : log.action === "move" ? "📦" : log.action === "archive" ? "📦" : log.action === "restore" ? "♻️" : "✏️";
                const actionColor = log.action === "delete" ? "#E53E3E" : log.action === "add" ? "#38A169" : log.action === "move" ? "#6C5CE7" : log.action === "archive" ? "#DD6B20" : log.action === "restore" ? "#38A169" : "var(--accent)";
                return (
                  <div key={log.id} style={{ padding:"10px 12px", borderBottom:"1px solid var(--border-light)", display:"flex", gap:10, alignItems:"flex-start" }}>
                    <span style={{ fontSize:16, lineHeight:1, marginTop:2 }}>{icon}</span>
                    <div style={{ flex:1 }}>
                      <div style={{ fontSize:12, fontWeight:600, color:"var(--text-primary)", marginBottom:2 }}>
                        <span style={{ color:actionColor }}>{log.user}</span>
                        <span style={{ color:"var(--text-muted)", fontWeight:400 }}> — </span>
                        <span style={{ fontWeight:700 }}>{log.taskName}</span>
                      </div>
                      <div style={{ fontSize:11, color:"var(--text-secondary)", marginBottom:2 }}>{log.detail}</div>
                      <div style={{ fontSize:10, color:"var(--text-muted)" }}>{log.time}</div>
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        </div>
      )}
      {showArchive && (
        <div style={{ position:"fixed", inset:0, background:"rgba(0,0,0,.45)", zIndex:9999, display:"flex", justifyContent:"center", alignItems:"center" }} onClick={()=>{setShowArchive(false);setArchiveDelConfirm(null);}}>
          <div onClick={e=>e.stopPropagation()} style={{ background:"var(--bg-card)", borderRadius:16, width:"90%", maxWidth:560, maxHeight:"80vh", display:"flex", flexDirection:"column", boxShadow:"0 20px 60px rgba(0,0,0,.25)" }}>
            <div style={{ padding:"16px 20px", borderBottom:"1.5px solid var(--border-light)", display:"flex", justifyContent:"space-between", alignItems:"center" }}>
              <span style={{ fontSize:14, fontWeight:700, color:"var(--text-primary)" }}>📦 Arsip ({archivedProjects.length})</span>
              <button onClick={()=>{setShowArchive(false);setArchiveDelConfirm(null);}} style={{ background:"none", border:"none", fontSize:18, cursor:"pointer", color:"var(--text-muted)", lineHeight:1 }}>✕</button>
            </div>
            <div style={{ padding:"12px 16px", overflowY:"auto", flex:1 }}>
              {archivedProjects.length === 0 ? (
                <div style={{ textAlign:"center", padding:30, color:"var(--text-muted)", fontSize:13 }}>Tidak ada project diarsipkan</div>
              ) : archivedProjects.map(ap => {
                const prevLabel = PHASES.find(ph => ph.id === ap._prevPhase)?.l || ap._prevPhase || "—";
                return (
                  <div key={ap.id} style={{ padding:"12px 14px", borderBottom:"1px solid var(--border-light)" }}>
                    {archiveDelConfirm === ap.id ? (
                      <div style={{ textAlign:"center", padding:"8px 0" }}>
                        <div style={{ fontSize:13, fontWeight:700, color:"var(--danger)", marginBottom:8 }}>Hapus permanen "{ap.name}"?</div>
                        <div style={{ fontSize:11, color:"var(--text-secondary)", marginBottom:12 }}>Tindakan ini tidak bisa dibatalkan.</div>
                        <div style={{ display:"flex", gap:8, justifyContent:"center" }}>
                          <button onClick={()=>{handleDeletePermanent(ap.id);setArchiveDelConfirm(null);}} style={{ padding:"6px 16px", borderRadius:8, border:"none", background:"var(--danger)", color:"#fff", fontSize:11, fontWeight:700, cursor:"pointer" }}>Ya, Hapus</button>
                          <button onClick={()=>setArchiveDelConfirm(null)} style={{ padding:"6px 16px", borderRadius:8, border:"1.5px solid var(--border)", background:"var(--bg-card)", color:"var(--text-secondary)", fontSize:11, fontWeight:600, cursor:"pointer" }}>Batal</button>
                        </div>
                      </div>
                    ) : (
                      <div style={{ display:"flex", alignItems:"center", gap:12 }}>
                        <div style={{ flex:1 }}>
                          <div style={{ fontSize:13, fontWeight:700, color:"var(--text-primary)", marginBottom:2 }}>{ap.name}</div>
                          <div style={{ fontSize:11, color:"var(--text-secondary)" }}>
                            <span style={{ background:"var(--bg-column)", padding:"2px 6px", borderRadius:4, marginRight:6, fontSize:10 }}>{ap.div}</span>
                            Dari: {prevLabel}
                          </div>
                        </div>
                        <div style={{ display:"flex", gap:6 }}>
                          <button onClick={()=>handleRestore(ap.id)} title="Pulihkan" style={{
                            padding:"6px 12px", borderRadius:8, border:"1.5px solid var(--success)", background:"var(--success-bg)",
                            color:"var(--success)", fontSize:11, fontWeight:700, cursor:"pointer", display:"flex", alignItems:"center", gap:4,
                          }}>♻️ Pulihkan</button>
                          <button onClick={()=>setArchiveDelConfirm(ap.id)} title="Hapus Permanen" style={{
                            padding:"6px 10px", borderRadius:8, border:"1.5px solid var(--danger-border)", background:"var(--danger-bg)",
                            color:"var(--danger)", fontSize:11, fontWeight:700, cursor:"pointer",
                          }}>🗑️</button>
                        </div>
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
          </div>
        </div>
      )}
      {/* Analytics placeholder — akan dibangun ulang */}
      {isAdmin && addPhase && <AddModal phase={addPhase} onClose={()=>setAddPhase(null)} onAdd={handleAdd} divs={divs} />}
      {isAdmin && showDivModal && <DivModal divs={divs} onClose={()=>setShowDivModal(false)} onSave={handleSaveDivs} projects={projects} />}
      {isAdmin && showUserModal && <UserModal users={users} onClose={()=>setShowUserModal(false)} onSave={handleSaveUsers} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
