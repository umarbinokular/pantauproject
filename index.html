function calcPhaseFromProgress(progress) {
  if (progress >= 100) return 'completed';
  if (progress >= 75) return 'review';
  if (progress > 0) return 'in_progress';
  return 'initiation';
}

/* ─── Auto-calculation ─── */
function calcProgress(milestones) {
  if (!milestones || milestones.length === 0) return 0;
  return Math.round((milestones.filter(m => m.d).length / milestones.length) * 100);
}

function calcMilestoneHealth(m) {
  if (m.d) return "done";
  const now = new Date();
  const end = new Date(m.e);
  const start = new Date(m.s);
  if (isNaN(end.getTime())) return "on_track";
  if (now > end) return "delayed";
  const totalDays = Math.max((end - start) / (1000*60*60*24), 1);
  const remaining = (end - now) / (1000*60*60*24);
  if (remaining / totalDays <= 0.25) return "at_risk";
  return "on_track";
}

function milestoneRemaining(m) {
  if (m.d) return "Selesai";
  const now = new Date();
  const end = new Date(m.e);
  if (isNaN(end.getTime())) return "";
  const days = Math.ceil((end - now) / (1000*60*60*24));
  if (days < 0) return `Terlambat ${Math.abs(days)} hari`;
  if (days === 0) return "Hari ini!";
  return `Sisa ${days} hari`;
}

const MS_COLORS = {
  done: "#48BB78",
  on_track: "#6C7AE0",
  at_risk: "#ECC94B",
  delayed: "#E53E3E",
};

function calcHealth(progress, start, deadline) {
  if (progress >= 100) return "completed";
  const now = new Date();
  const dl = new Date(deadline);
  const st = new Date(start);
  if (isNaN(dl.getTime()) || isNaN(st.getTime())) return "on_track";
  const totalDays = (dl - st) / (1000*60*60*24);
  const elapsedDays = (now - st) / (1000*60*60*24);
  const timeUsedPct = totalDays > 0 ? (elapsedDays / totalDays) * 100 : 0;
  if (now > dl && progress < 100) return "delayed";
  if (timeUsedPct > progress + 30) return "at_risk";
  return "on_track";
}

function calcPhase(progress) {
  if (progress >= 100) return "completed";
  if (progress >= 75) return "review";
  if (progress > 0) return "in_progress";
  return "initiation";
}

function autoCalc(p, manualPhase) {
  const progress = calcProgress(p.milestones);
  const health = p.health === "blocked" ? "blocked" : calcHealth(progress, p.start, p.deadline);
  const phase = manualPhase || p._manualPhase || calcPhase(progress);
  return { ...p, progress, health, phase, _manualPhase: manualPhase || p._manualPhase || null };
}

              <div style={{ fontSize:28, marginBottom:8 }}>💾</div>
              <div style={{ fontSize:14, fontWeight:700, color:"var(--text-primary)", marginBottom:4 }}>Ada perubahan belum disimpan</div>
              <div style={{ fontSize:12, color:"var(--text-secondary)", marginBottom:16 }}>Simpan perubahan sebelum keluar?</div>
              <div style={{ display:"flex", gap:8 }}>
                <button onClick={()=>{onSave(form);onClose();}} style={{ flex:1, padding:"10px", borderRadius:10, border:"none", background:"var(--success)", color:"#fff", fontSize:13, fontWeight:700, cursor:"pointer" }}>Simpan</button>
                <button onClick={onClose} style={{ flex:1, padding:"10px", borderRadius:10, border:"1.5px solid var(--border)", background:"var(--bg-card)", color:"var(--text-secondary)", fontSize:13, fontWeight:600, cursor:"pointer" }}>Buang</button>

              </div>
            </div>
          </div>
        )}

      </div>
    </div>
  );
}

/* ── Division Management Modal ── */
function DivModal({ divs, onClose, onSave, projects }) {
  const [list, setList] = useState([...divs]);
  const [newName, setNewName] = useState("");

  const usedDivs = new Set(projects.map(p=>p.div));

  const handleAdd = () => {
    if(!newName.trim() || list.some(d=>d.toLowerCase()===newName.trim().toLowerCase())) return;
    setList(prev=>[...prev, newName.trim()]);
    setNewName("");
  };
  const handleRemove = (i) => {
    if(usedDivs.has(list[i])) return;
    setList(prev=>prev.filter((_,idx)=>idx!==i));
  };
  const handleEdit = (i,v) => {
    setList(prev=>prev.map((d,idx)=>idx===i?v:d));
  };

  return (
    <div onClick={onClose} style={{ position:"fixed", inset:0, background:"var(--modal-overlay)", display:"flex", alignItems:"center", justifyContent:"center", zIndex:200, padding:16 }}>
      <div onClick={e=>e.stopPropagation()} style={{ background:"var(--bg-card)", borderRadius:18, maxWidth:440, width:"100%", maxHeight:"90vh", overflow:"auto", padding:"26px 22px", position:"relative" }}>
        <button onClick={onClose} style={{ position:"absolute", top:12, right:12, background:"var(--bg-secondary)", border:"none", fontSize:14, cursor:"pointer", color:"var(--text-muted)", width:28, height:28, borderRadius:"50%", display:"flex", alignItems:"center", justifyContent:"center" }}>✕</button>
        <h2 style={{ fontSize:17, fontWeight:800, color:"var(--text-primary)", margin:"0 0 16px" }}>🏢 Kelola Divisi</h2>

        {list.map((d,i)=>{
          const inUse = usedDivs.has(d);
          return (
            <div key={i} style={{ display:"flex", alignItems:"center", gap:8, marginBottom:8, padding:"8px 10px", background:"var(--bg-secondary)", borderRadius:10 }}>
              <input value={d} onChange={e=>handleEdit(i,e.target.value)} style={{...inputStyle, flex:1, padding:"6px 8px", fontSize:13}} />
              {inUse ? (
                <span style={{ fontSize:9, color:"var(--text-muted)", whiteSpace:"nowrap" }}>Dipakai</span>
              ) : (
                <button onClick={()=>handleRemove(i)} style={{ background:"none", border:"none", cursor:"pointer", color:"var(--danger)", fontSize:14, padding:4 }}>✕</button>
              )}
            </div>
          );
        })}

        <div style={{ display:"flex", alignItems:"center", gap:8, marginTop:12, padding:"10px", background:"var(--bg-secondary)", borderRadius:10, border:"1.5px dashed var(--text-subtle)" }}>
          <input value={newName} onChange={e=>setNewName(e.target.value)} placeholder="Nama divisi baru..." style={{...inputStyle, flex:1, padding:"6px 8px", fontSize:13}}
            onKeyDown={e=>e.key==="Enter"&&handleAdd()} />
          <button onClick={handleAdd} style={{ background:"var(--accent)", border:"none", color:"#fff", borderRadius:8, padding:"6px 14px", fontSize:12, fontWeight:700, cursor:"pointer", whiteSpace:"nowrap" }}>+ Tambah</button>
        </div>

        <div style={{ display:"flex", gap:8, marginTop:16 }}>
          <button onClick={()=>{onSave(list);onClose();}} style={{ flex:1, padding:"10px", borderRadius:10, border:"none", background:"var(--success)", color:"#fff", fontSize:13, fontWeight:700, cursor:"pointer" }}>💾 Simpan</button>

        </div>
      </div>
    </div>
  );
}

function UserModal({ users, onClose, onSave }) {
  const PER_PAGE = 5;
  const [list, setList] = useState(users.map(u=>({...u})));
  const [newUser, setNewUser] = useState({ username:"", password:"", name:"", role:"viewer" });
  const [showPw, setShowPw] = useState({});
  const [expandedId, setExpandedId] = useState(null);
  const [searchUser, setSearchUser] = useState("");
  const [page, setPage] = useState(1);
  const [showConfirm, setShowConfirm] = useState(false);

  const hasChanges = JSON.stringify(list) !== JSON.stringify(users);

  const handleClose = () => {
    if (hasChanges) { setShowConfirm(true); }
    else onClose();
  };

  const handleAdd = () => {
    if(!newUser.username.trim() || !newUser.password.trim()) return;
    if(list.some(u=>u.username.toLowerCase()===newUser.username.trim().toLowerCase())) return;
    const id = "u"+Date.now();
    setList(prev=>[...prev, {...newUser, username:newUser.username.trim(), name:newUser.name.trim()||newUser.username.trim(), id, active:true}]);
    setNewUser({ username:"", password:"", name:"", role:"viewer" });
    setExpandedId(id);
    setPage(Math.ceil((list.length + 1) / PER_PAGE));
  };
  const handleToggleActive = (i) => {
    const u = list[i];
    if(u.active && u.role==="admin" && list.filter(x=>x.role==="admin"&&x.active).length<=1) return;
    setList(prev=>prev.map((x,idx)=>idx===i?{...x, active:!x.active}:x));
  };
  const handleEdit = (i,field,v) => {
    setList(prev=>prev.map((u,idx)=>idx===i?{...u,[field]:v}:u));
  };

  const [filterRole, setFilterRole] = useState("all");

  const filteredList = list.filter(u => {
    if (searchUser && !u.name.toLowerCase().includes(searchUser.toLowerCase()) && !u.username.toLowerCase().includes(searchUser.toLowerCase())) return false;
    if (filterRole !== "all" && u.role !== filterRole) return false;
    return true;
  });
  const totalPages = Math.max(1, Math.ceil(filteredList.length / PER_PAGE));
  const safePage = Math.min(page, totalPages);
  const pagedList = filteredList.slice((safePage - 1) * PER_PAGE, safePage * PER_PAGE);

  return (
    <div onClick={handleClose} style={{ position:"fixed", inset:0, background:"var(--modal-overlay)", display:"flex", alignItems:"center", justifyContent:"center", zIndex:200, padding:16 }}>

        <button onClick={handleClose} style={{ position:"absolute", top:12, right:12, background:"var(--bg-secondary)", border:"none", fontSize:14, cursor:"pointer", color:"var(--text-muted)", width:28, height:28, borderRadius:"50%", display:"flex", alignItems:"center", justifyContent:"center" }}>✕</button>
        <h2 style={{ fontSize:17, fontWeight:800, color:"var(--text-primary)", margin:"0 0 12px" }}>👤 Kelola User</h2>

        <div style={{ marginBottom:14, padding:"12px", background:"var(--bg-secondary)", borderRadius:10, border:"1.5px dashed var(--text-subtle)" }}>
          <div style={{ fontSize:10, fontWeight:600, color:"var(--text-muted)", marginBottom:8 }}>TAMBAH USER BARU</div>
          <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:6, marginBottom:8 }}>
            <div>
              <label style={{ fontSize:9, color:"var(--text-muted)", fontWeight:600 }}>NAMA</label>
              <input value={newUser.name} onChange={e=>setNewUser(p=>({...p,name:e.target.value}))} placeholder="Nama" style={{...inputStyle, padding:"6px 8px", fontSize:12}} />
            </div>
            <div>
              <label style={{ fontSize:9, color:"var(--text-muted)", fontWeight:600 }}>JENIS USER</label>
              <select value={newUser.role} onChange={e=>setNewUser(p=>({...p,role:e.target.value}))} style={{...inputStyle, padding:"6px 8px", fontSize:12}}>
                <option value="viewer">👁️ Viewer</option>
                <option value="admin">🔧 Admin</option>
              </select>
            </div>
            <div>
              <label style={{ fontSize:9, color:"var(--text-muted)", fontWeight:600 }}>USERNAME *</label>
              <input value={newUser.username} onChange={e=>setNewUser(p=>({...p,username:e.target.value}))} placeholder="Username" style={{...inputStyle, padding:"6px 8px", fontSize:12}} />
            </div>
            <div>
              <label style={{ fontSize:9, color:"var(--text-muted)", fontWeight:600 }}>PASSWORD *</label>
              <input type="password" value={newUser.password} onChange={e=>setNewUser(p=>({...p,password:e.target.value}))} placeholder="Password" style={{...inputStyle, padding:"6px 8px", fontSize:12}} />
            </div>
          </div>
          <button onClick={()=>{
            if(!newUser.username.trim() || !newUser.password.trim()) return;
            if(list.some(u=>u.username.toLowerCase()===newUser.username.trim().toLowerCase())) return;
            const newU = {...newUser, username:newUser.username.trim(), name:newUser.name.trim()||newUser.username.trim(), id:"u"+Date.now(), active:true};

        <div style={{ display:"flex", alignItems:"center", gap:8, marginBottom:10 }}>
          <input value={searchUser} onChange={e=>{setSearchUser(e.target.value);setPage(1);}} placeholder="🔍 Cari user..."

          <select value={filterRole} onChange={e=>{setFilterRole(e.target.value);setPage(1);}}

            <option value="all">Semua</option>
            <option value="admin">🔧 Admin</option>
            <option value="viewer">👁️ Viewer</option>
          </select>
          <span style={{ fontSize:11, color:"var(--text-muted)", whiteSpace:"nowrap" }}>{filteredList.length} user</span>
        </div>

        {pagedList.map(u=>{

function App() {
  const [users, setUsers] = useState(INIT_USERS);
  const [currentUser, setCurrentUser] = useState(null);
  const [projects, setProjects] = useState(initProjects);
  const [divs, setDivs] = useState(INIT_DIVS);
  const [selected, setSelected] = useState(null);
  const [openInEdit, setOpenInEdit] = useState(false);
  const [addPhase, setAddPhase] = useState(null);
  const [showDivModal, setShowDivModal] = useState(false);
  const [showUserModal, setShowUserModal] = useState(false);
  const [loaded, setLoaded] = useState(false);
  const [loadError, setLoadError] = useState(null);
  const isAdmin = currentUser?.role === "admin";

  // Dark mode
  const [darkMode, setDarkMode] = useState(() => {
    try { return localStorage.getItem('pantau-theme') === 'dark'; } catch(e) { return false; }
  });
  useEffect(() => {
    document.documentElement.setAttribute('data-theme', darkMode ? 'dark' : 'light');
  }, [darkMode]);
  const toggleTheme = () => {
    const next = !darkMode;
    setDarkMode(next);
    try { localStorage.setItem('pantau-theme', next ? 'dark' : 'light'); } catch(e) {}
  };

  // Division name ↔ id mappings
  const [divIdMap, setDivIdMap] = useState({});
  const [divNameToId, setDivNameToId] = useState({});

  // Load data from Supabase
  const loadData = useCallback(async () => {
    try {
      const divData = await DB.getDivisions();
      const idMap = {};
      const nameMap = {};
      divData.forEach(d => { idMap[d.id] = d.name; nameMap[d.name] = d.id; });
      setDivIdMap(idMap);
      setDivNameToId(nameMap);
      setDivs(divData.map(d => d.name));

      const projectData = await DB.getProjects(idMap);
      setProjects(projectData.map(p => autoCalc(p)));

      const userData = await DB.getUsers();
      if (userData.length > 0) setUsers(userData);

      setLoaded(true);
    } catch (err) {
      console.error('Supabase load error:', err);
      setLoadError('Gagal koneksi ke Supabase. Periksa URL dan API Key.');
      setLoaded(true);
    }
  }, []);

  useEffect(() => { loadData(); }, [loadData]);

  const [filterHealth, setFilterHealth] = useState("all");
  const [filterDiv, setFilterDiv] = useState("all");
  const [filterPriority, setFilterPriority] = useState("all");
  const [search, setSearch] = useState("");
  const [filterDateFrom, setFilterDateFrom] = useState("");
  const [filterDateTo, setFilterDateTo] = useState("");
  const [datePreset, setDatePreset] = useState("");
  const [showAllCompleted, setShowAllCompleted] = useState(false);
  const COMPLETED_LIMIT = 5;
  const [dragOverCol, setDragOverCol] = useState(null);
  const [dropTarget, setDropTarget] = useState(null);
  const dragId = useRef(null);

  const onDragStart = (e, id) => { dragId.current = id; e.dataTransfer.effectAllowed = "move"; setTimeout(()=>{e.target.style.opacity="0.4";},0); };
  const onDragEnd = (e) => { e.target.style.opacity = "1"; setDragOverCol(null); setDropTarget(null); };

  const onCardDragOver = (e, phaseId, index) => {
    e.preventDefault(); e.stopPropagation();
    e.dataTransfer.dropEffect = "move";
    const rect = e.currentTarget.getBoundingClientRect();
    const midY = rect.top + rect.height / 2;
    const insertIdx = e.clientY < midY ? index : index + 1;
    setDragOverCol(phaseId);
    setDropTarget({phase: phaseId, index: insertIdx});
  };

  const onColDragOver = (e, phaseId, cardCount) => {
    e.preventDefault();
    e.dataTransfer.dropEffect = "move";
    setDragOverCol(phaseId);
    if (!dropTarget || dropTarget.phase !== phaseId) {
      setDropTarget({phase: phaseId, index: cardCount});
    }
  };

  const onDragLeave = (e) => {
    const related = e.relatedTarget;
    if (!e.currentTarget.contains(related)) {
      setDragOverCol(null);
      setDropTarget(null);
    }
  };

  const onDrop = (e, targetPhase) => {
    e.preventDefault();
    setDragOverCol(null);
    const id = dragId.current;
    const target = dropTarget;
    setDropTarget(null);
    if (!id) return;

    setProjects(prev => {
      const targetCards = prev.filter(p => p.phase === targetPhase && p.id !== id);
      const otherCards = prev.filter(p => p.phase !== targetPhase && p.id !== id);
      const draggedCard = prev.find(p => p.id === id);
      if (!draggedCard) return prev;

      const updated = autoCalc({...draggedCard}, targetPhase);
      const insertIdx = target ? Math.min(target.index, targetCards.length) : targetCards.length;
      targetCards.splice(insertIdx, 0, updated);

      DB.saveProject(updated, divNameToId);

      return [...otherCards, ...targetCards];
    });
    dragId.current = null;
  };

  const handleSave = async (updated) => {
    const calculated = autoCalc(updated);
    await DB.saveProject(calculated, divNameToId);
    setProjects(prev => prev.map(p => p.id === calculated.id ? calculated : p));
    setSelected(calculated);
  };

  const handleDelete = async (id) => {
    const p = projects.find(x => x.id === id);
    if (p && p._dbId) await DB.deleteProject(p._dbId);
    setProjects(prev => prev.filter(p => p.id !== id));
    setSelected(null);
  };

  const handleAdd = async (project) => {
    const calculated = autoCalc(project);
    const saved = await DB.saveProject(calculated, divNameToId);
    setProjects(prev => [...prev, saved]);
    setOpenInEdit(true);
    setSelected(saved);
  };

  const handleMove = async (id, targetPhase) => {
    setProjects(prev => {
      const card = prev.find(p => p.id === id);
      if (!card) return prev;
      const updated = autoCalc({...card}, targetPhase);
      DB.saveProject(updated, divNameToId);
      return prev.map(p => p.id === id ? updated : p);
    });
  };

  const handleSaveDivs = async (newDivs) => {
    setDivs(newDivs);
    await DB.saveDivisions(newDivs);
    const divData = await DB.getDivisions();
    const idMap = {};
    const nameMap = {};
    divData.forEach(d => { idMap[d.id] = d.name; nameMap[d.name] = d.id; });
    setDivIdMap(idMap);
    setDivNameToId(nameMap);
  };

  const handleSaveUsers = async (updatedUsers) => {
    setUsers(updatedUsers);
    await DB.saveUsers(updatedUsers);
  };

  const handleResetAdmin = async () => {
    await DB.resetAdmin();
  };

  const parseDate = (dl) => {
    try { const d = new Date(dl); return isNaN(d.getTime()) ? null : d; } catch { return null; }
  };
  const filtered = projects.filter(p => {
    if (filterHealth !== "all" && p.health !== filterHealth) return false;
    if (filterDiv !== "all" && p.div !== filterDiv) return false;
    if (filterPriority !== "all" && p.priority !== filterPriority) return false;
    if (search && !p.name.toLowerCase().includes(search.toLowerCase()) && !p.div.toLowerCase().includes(search.toLowerCase())) return false;
    if (filterDateFrom || filterDateTo) {
      const pStart = parseDate(p.start);
      const pEnd = parseDate(p.deadline);
      const from = filterDateFrom ? new Date(filterDateFrom) : null;
      const to = filterDateTo ? new Date(filterDateTo) : null;
      if (from && pEnd && pEnd < from) return false;
      if (to && pStart && pStart > to) return false;
    }
    return true;
  });

  const divisions = divs;
  const priorityCount = projects.filter(p=>p.priority==='priority').length;
  const normalCount = projects.filter(p=>p.priority!=='priority').length;

  if (!currentUser) return <LoginScreen onLogin={setCurrentUser} onResetAdmin={handleResetAdmin} />;

  return (
    <div style={{ fontFamily:"'Inter',-apple-system,sans-serif", background:"var(--bg-main)", minHeight:"100vh", transition:"background .3s" }}>

      {/* Connection error banner */}
      {loadError && (
        <div style={{ background:"var(--danger-border)", color:"#9B2C2C", padding:"10px 20px", fontSize:12, fontWeight:600, textAlign:"center" }}>
          ⚠️ {loadError}
        </div>
      )}

      {/* Header */}
      <div style={{ background:"var(--bg-card)", padding:"14px 20px", borderBottom:"1.5px solid var(--border-light)", display:"flex", alignItems:"center", justifyContent:"space-between", flexWrap:"wrap", gap:8 }}>
        <h1 style={{ fontSize:17, fontWeight:800, color:"var(--text-primary)", margin:0 }}>Pantau Project</h1>
        <div style={{ display:"flex", alignItems:"center", gap:8, flexWrap:"wrap" }}>
          <button onClick={toggleTheme} style={{
            fontSize:12, fontWeight:600, padding:"6px 12px", borderRadius:8, border:"1.5px solid var(--border)",
            background:"var(--bg-secondary)", color:"var(--text-secondary)", cursor:"pointer",
            display:"flex", alignItems:"center", gap:4,
          }}>
            {darkMode ? "☀️ Light" : "🌙 Dark"}
          </button>
          {isAdmin && (
            <button onClick={()=>setShowUserModal(true)} style={{ fontSize:12, fontWeight:600, padding:"6px 14px", borderRadius:8, border:"1.5px solid var(--border)", background:"var(--bg-card)", color:"var(--text-secondary)", cursor:"pointer" }}>👤 Kelola User</button>
          )}
          {isAdmin && (
            <button onClick={()=>setShowDivModal(true)} style={{ fontSize:12, fontWeight:600, padding:"6px 14px", borderRadius:8, border:"1.5px solid var(--border)", background:"var(--bg-card)", color:"var(--text-secondary)", cursor:"pointer" }}>🏢 Kelola Divisi</button>
          )}
          <div style={{ display:"flex", alignItems:"center", gap:6, padding:"4px 12px", background:"var(--bg-secondary)", borderRadius:8 }}>
            <span style={{ fontSize:11, fontWeight:700, padding:"2px 8px", borderRadius:6, background:isAdmin?"var(--accent-bg)":"var(--bg-column)", color:isAdmin?"var(--accent)":"var(--text-secondary)" }}>{isAdmin?"🔧 Admin":"👁️ Viewer"}</span>
            <span style={{ fontSize:12, fontWeight:600, color:"var(--text-primary)" }}>{currentUser.name}</span>
          </div>
          <button onClick={()=>setCurrentUser(null)} style={{ fontSize:12, fontWeight:600, padding:"6px 14px", borderRadius:8, border:"1.5px solid var(--danger-border)", background:"var(--danger-bg)", color:"var(--danger)", cursor:"pointer" }}>Keluar</button>
        </div>
      </div>

      {/* Filters + Health status */}
      <div style={{ padding:"8px 20px", display:"flex", alignItems:"center", gap:8, flexWrap:"wrap", background:"var(--bg-card)", borderBottom:"1.5px solid var(--border-light)" }}>
        <input type="text" placeholder="🔍 Cari..." value={search} onChange={e=>setSearch(e.target.value)}
          style={{ fontSize:12, padding:"6px 10px", borderRadius:8, border:"1.5px solid var(--border-light)", outline:"none", width:140, background:"var(--bg-secondary)", color:"var(--text-primary)" }} />
        <div style={{ display:"flex", alignItems:"center", gap:4 }}>
          <select value={datePreset} onChange={e=>{
            const v = e.target.value;
            setDatePreset(v);
            const now = new Date();
            const y = now.getFullYear();
            const fmt = d => d.toISOString().split("T")[0];
            if(v==="") { setFilterDateFrom(""); setFilterDateTo(""); }
            else if(v==="q1") { setFilterDateFrom(fmt(new Date(y,0,1))); setFilterDateTo(fmt(new Date(y,2,31))); }
            else if(v==="q2") { setFilterDateFrom(fmt(new Date(y,3,1))); setFilterDateTo(fmt(new Date(y,5,30))); }
            else if(v==="q3") { setFilterDateFrom(fmt(new Date(y,6,1))); setFilterDateTo(fmt(new Date(y,8,30))); }
            else if(v==="q4") { setFilterDateFrom(fmt(new Date(y,9,1))); setFilterDateTo(fmt(new Date(y,11,31))); }
            else if(v==="this_year") { setFilterDateFrom(fmt(new Date(y,0,1))); setFilterDateTo(fmt(new Date(y,11,31))); }
            else if(v==="last_year") { setFilterDateFrom(fmt(new Date(y-1,0,1))); setFilterDateTo(fmt(new Date(y-1,11,31))); }
            else if(v==="custom") {}
          }} style={{ fontSize:11, padding:"6px 8px", borderRadius:8, border:"1.5px solid var(--border-light)", background:"var(--bg-secondary)", cursor:"pointer", color:"var(--text-secondary)" }}>
            <option value="">📅 Semua Periode</option>
            <option value="q1">Kwartal 1 (Jan–Mar)</option>
            <option value="q2">Kwartal 2 (Apr–Jun)</option>
            <option value="q3">Kwartal 3 (Jul–Sep)</option>
            <option value="q4">Kwartal 4 (Okt–Des)</option>
            <option value="this_year">Tahun ini</option>
            <option value="last_year">Tahun lalu</option>
            <option value="custom">Pilih tanggal...</option>
          </select>
          {(datePreset==="custom" || filterDateFrom || filterDateTo) && (
            <>
              <input type="date" value={filterDateFrom} onChange={e=>{setFilterDateFrom(e.target.value);setDatePreset("custom");}} title="Dari tanggal"
                style={{ fontSize:11, padding:"6px 8px", borderRadius:8, border:"1.5px solid var(--border-light)", outline:"none", background:"var(--bg-secondary)", cursor:"pointer", color:"var(--text-secondary)" }} />
              <span style={{ fontSize:11, color:"var(--text-muted)" }}>—</span>
              <input type="date" value={filterDateTo} onChange={e=>{setFilterDateTo(e.target.value);setDatePreset("custom");}} title="Sampai tanggal"
                style={{ fontSize:11, padding:"6px 8px", borderRadius:8, border:"1.5px solid var(--border-light)", outline:"none", background:"var(--bg-secondary)", cursor:"pointer", color:"var(--text-secondary)" }} />
            </>
          )}
          {(filterDateFrom || filterDateTo) && (
            <button onClick={()=>{setFilterDateFrom("");setFilterDateTo("");setDatePreset("");}} style={{ fontSize:11, padding:"5px 8px", borderRadius:8, border:"1.5px solid var(--danger-border)", background:"var(--danger-bg)", color:"var(--danger)", cursor:"pointer", fontWeight:600 }}>✕</button>
          )}
        </div>
        <select value={filterDiv} onChange={e=>setFilterDiv(e.target.value)}
          style={{ fontSize:12, padding:"6px 8px", borderRadius:8, border:"1.5px solid var(--border-light)", background:"var(--bg-secondary)", cursor:"pointer", color:"var(--text-secondary)" }}>
          <option value="all">Semua Divisi</option>
          {divisions.map(d=><option key={d} value={d}>{d}</option>)}
        </select>

        {/* Priority filter */}
        <div style={{ display:"flex", alignItems:"center", gap:4 }}>
          <button onClick={()=>setFilterPriority(filterPriority==="priority"?"all":"priority")} style={{
            fontSize:10, fontWeight:600, padding:"4px 10px", borderRadius:8, cursor:"pointer", transition:"all .15s",
            border: filterPriority==="priority" ? "1.5px solid #E53E3E" : "1.5px solid var(--border)",
            background: filterPriority==="priority" ? "var(--priority-badge-bg)" : "var(--bg-card)",
            color: filterPriority==="priority" ? "var(--priority-badge-color)" : "var(--text-secondary)",
          }}>🔥 Prioritas ({priorityCount})</button>
          <button onClick={()=>setFilterPriority(filterPriority==="normal"?"all":"normal")} style={{
            fontSize:10, fontWeight:600, padding:"4px 10px", borderRadius:8, cursor:"pointer", transition:"all .15s",
            border: filterPriority==="normal" ? "1.5px solid var(--accent)" : "1.5px solid var(--border)",
            background: filterPriority==="normal" ? "var(--accent-bg)" : "var(--bg-card)",
            color: filterPriority==="normal" ? "var(--accent)" : "var(--text-secondary)",
          }}>📁 Reguler ({normalCount})</button>
        </div>

        <div style={{ marginLeft:"auto", display:"flex", alignItems:"center", gap:4, flexWrap:"wrap" }}>
          <button onClick={()=>setFilterHealth("all")} style={{
            fontSize:10, fontWeight:600, padding:"4px 10px", borderRadius:8, cursor:"pointer", transition:"all .15s",
            border: filterHealth==="all" ? "1.5px solid var(--accent)" : "1.5px solid var(--border)",
            background: filterHealth==="all" ? "var(--accent-bg)" : "var(--bg-card)",
            color: filterHealth==="all" ? "var(--accent)" : "var(--text-secondary)",
          }}>Semua ({projects.length})</button>
          {Object.entries(H).map(([k,v])=>{
            const cnt = projects.filter(p=>p.health===k).length;
            return (
              <button key={k} onClick={()=>setFilterHealth(filterHealth===k?"all":k)} style={{
                fontSize:10, fontWeight:600, padding:"4px 10px", borderRadius:8, cursor:"pointer", transition:"all .15s",
                border: filterHealth===k ? `1.5px solid ${v.border}` : "1.5px solid var(--border)",
                background: filterHealth===k ? v.bg : "var(--bg-card)",
                color: filterHealth===k ? v.c : "var(--text-secondary)",
              }}>{v.e} {v.l} ({cnt})</button>
            );
          })}
        </div>
      </div>

      {/* Kanban columns */}
      <div style={{ padding:"12px 20px 40px", display:"flex", gap:12, overflowX:"auto", minHeight:"calc(100vh - 200px)" }}>
        {PHASES.map(ph => {
          const cards = filtered.filter(p => p.phase === ph.id);
          const isOver = isAdmin && dragOverCol === ph.id;
          // Sort: priority first
          const sortedCards = [...cards].sort((a,b) => {
            if (a.priority === 'priority' && b.priority !== 'priority') return -1;
            if (a.priority !== 'priority' && b.priority === 'priority') return 1;
            return 0;
          });
          return (
            <div key={ph.id}
              onDragOver={e => isAdmin && onColDragOver(e, ph.id, sortedCards.length)}
              onDragLeave={onDragLeave}
              onDrop={e => isAdmin && onDrop(e, ph.id)}
              style={{ flex:"1 0 260px", maxWidth:340, minWidth:260 }}
            >
              <div style={{ background:"var(--bg-card)", borderRadius:"12px 12px 0 0", padding:"10px 14px", borderBottom:"2px solid var(--border-light)", display:"flex", alignItems:"center", justifyContent:"space-between" }}>
                <div>
                  <div style={{ fontSize:13, fontWeight:700, color:"var(--text-primary)" }}>{ph.l}</div>
                  <div style={{ fontSize:10, color:"var(--text-muted)" }}>{ph.n}</div>
                </div>
                <div style={{ display:"flex", alignItems:"center", gap:6 }}>
                  <span style={{ fontSize:13, fontWeight:700, background:"var(--bg-column)", color:"var(--text-secondary)", borderRadius:"50%", width:26, height:26, display:"flex", alignItems:"center", justifyContent:"center" }}>{cards.length}</span>
                  {isAdmin && (
                    <button onClick={()=>setAddPhase(ph.id)} title="Tambah project" style={{ background:"none", border:"1.5px solid var(--border)", borderRadius:"50%", width:26, height:26, display:"flex", alignItems:"center", justifyContent:"center", cursor:"pointer", fontSize:14, color:"var(--text-muted)", lineHeight:1 }}>+</button>
                  )}
                </div>
              </div>
              {(() => {
                const isCompleted = ph.id === "completed";
                const hiddenCount = isCompleted && !showAllCompleted ? Math.max(0, sortedCards.length - COMPLETED_LIMIT) : 0;
                const visibleCards = isCompleted && !showAllCompleted ? sortedCards.slice(0, COMPLETED_LIMIT) : sortedCards;
                return (
                  <div style={{
                    background: isOver ? "var(--accent-bg)" : "var(--bg-column)", borderRadius:"0 0 12px 12px", padding:"8px 8px 12px",
                    minHeight:120, transition:"background .15s", border: isOver ? "2px dashed var(--accent)" : "2px dashed transparent",
                  }}>
                    {visibleCards.map((p, idx) => (
                      <div key={p.id}>
                        {isAdmin && dropTarget && dropTarget.phase === ph.id && dropTarget.index === idx && dragId.current && dragId.current !== p.id && (
                          <div style={{ height:3, borderRadius:2, background:"var(--accent)", margin:"2px 4px 4px" }} />
                        )}
                        <div
                          onDragEnd={onDragEnd}
                          onDragOver={e => isAdmin && onCardDragOver(e, ph.id, idx)}
                        >
                          <Card p={p} onClick={setSelected} onDragStart={onDragStart} isAdmin={isAdmin} />
                        </div>
                      </div>
                    ))}
                    {isAdmin && dropTarget && dropTarget.phase === ph.id && dropTarget.index >= sortedCards.length && dragId.current && !sortedCards.find(c=>c.id===dragId.current && sortedCards.indexOf(c)===sortedCards.length-1) && (
                      <div style={{ height:3, borderRadius:2, background:"var(--accent)", margin:"2px 4px" }} />
                    )}
                    {isCompleted && sortedCards.length > COMPLETED_LIMIT && (
                      <button onClick={()=>setShowAllCompleted(!showAllCompleted)} style={{
                        width:"100%", padding:"8px", borderRadius:8, border:"1.5px dashed var(--text-subtle)",
                        background:"var(--bg-card)", color:"var(--text-secondary)", fontSize:11, fontWeight:600,
                        cursor:"pointer", marginTop:4, transition:"all .15s",
                      }}>
                        {showAllCompleted ? "⬆️ Sembunyikan" : `⬇️ Tampilkan ${hiddenCount} lainnya`}
                      </button>
                    )}
                    {sortedCards.length === 0 && (
                      <div style={{ textAlign:"center", padding:"28px 12px", color:"var(--text-subtle)", fontSize:12, border:"2px dashed var(--border)", borderRadius:10, background:"var(--bg-card)" }}>
                        {isAdmin ? "Geser card ke sini" : "Tidak ada project"}
                      </div>
                    )}
                  </div>
                );
              })()}
            </div>
          );
        })}
      </div>

      <Modal p={selected} onClose={()=>{setSelected(null);setOpenInEdit(false);}} onSave={handleSave} onDelete={handleDelete} onMove={handleMove} isAdmin={isAdmin} divs={divs} startInEdit={openInEdit} />
      {isAdmin && addPhase && <AddModal phase={addPhase} onClose={()=>setAddPhase(null)} onAdd={handleAdd} divs={divs} />}
      {isAdmin && showDivModal && <DivModal divs={divs} onClose={()=>setShowDivModal(false)} onSave={handleSaveDivs} projects={projects} />}
      {isAdmin && showUserModal && <UserModal users={users} onClose={()=>setShowUserModal(false)} onSave={handleSaveUsers} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
